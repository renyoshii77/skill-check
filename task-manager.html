<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus — タスク管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --bg-sunk:#F6F7FA; --card:#FFFFFF; --border:#E7E9EF;
    --ink:#1B1D23; --ink-soft:#6B7080; --ink-faint:#9CA0AF;
    --accent:#4C5FD5; --accent-soft:#EEF0FC; --accent-ink:#3646B8;
    --danger:#D8483F; --danger-soft:#FCEBEA;
    --amber:#C98A2B; --amber-soft:#FCF2E2;
    --green:#2E9563; --green-soft:#E8F6EF;
    --grey-dot:#9CA0AF;
    --shadow: 0 1px 2px rgba(20,22,30,.04), 0 8px 24px rgba(20,22,30,.05);
    --radius:14px; --radius-sm:9px;
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --bg:#15161B; --bg-sunk:#1B1D24; --card:#1E2028; --border:#2C2F3A;
    --ink:#F1F2F6; --ink-soft:#A7ACC0; --ink-faint:#6E7286;
    --accent:#7C8AF0; --accent-soft:#262B4A; --accent-ink:#AEB8FF;
    --danger:#E5766D; --danger-soft:#3A2523;
    --amber:#E0A94F; --amber-soft:#3A2F1C;
    --green:#54BB8B; --green-soft:#1B3428;
    --grey-dot:#6E7286;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15161B; --bg-sunk:#1B1D24; --card:#1E2028; --border:#2C2F3A;
      --ink:#F1F2F6; --ink-soft:#A7ACC0; --ink-faint:#6E7286;
      --accent:#7C8AF0; --accent-soft:#262B4A; --accent-ink:#AEB8FF;
      --danger:#E5766D; --danger-soft:#3A2523;
      --amber:#E0A94F; --amber-soft:#3A2F1C;
      --green:#54BB8B; --green-soft:#1B3428;
      --grey-dot:#6E7286;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
    font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:2.5px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.001ms !important; animation-duration:.001ms !important;} }
  .status-banner{display:flex; align-items:flex-start; gap:8px; padding:10px 14px;
    border-radius:var(--radius-sm); font-size:13px; font-weight:600; margin-bottom:12px;
    border:1.5px solid transparent; line-height:1.5;}
  .status-banner .sb-icon{flex:none; font-size:15px; margin-top:1px;}
  .status-banner .sb-body{flex:1; min-width:0;}
  .status-banner.warn{background:var(--amber-soft); color:#7A551A; border-color:#F0DBAF;}
  .status-banner.error{background:var(--danger-soft); color:#8C2E22; border-color:#F0C6C0;}
  h1,h2,h3,.disp{font-family:'Sora',sans-serif;}
  button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  a{color:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---- App shell ---- */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:224px; flex:none; background:var(--bg-sunk); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 12px; position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:9px; padding:6px 8px 20px;}
  .brand-mark{width:26px;height:26px;border-radius:8px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex:none;}
  .brand-name{font-family:'Sora',sans-serif; font-weight:700; font-size:16px;}
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px;
    border:none; background:none; text-align:left; color:var(--ink-soft); font-weight:500; font-size:13.5px;}
  .nav-item:hover{background:var(--card); color:var(--ink);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:600;}
  .nav-icon{width:18px; text-align:center; flex:none; font-size:15px;}
  .nav-badge{margin-left:auto; background:var(--danger); color:#fff; font-size:10.5px; font-weight:700;
    padding:1px 6px; border-radius:20px;}
  .nav-spacer{flex:1;}
  .sidebar-foot{padding:10px 8px 4px; border-top:1px solid var(--border); margin-top:8px;}
  .add-btn{width:100%; padding:10px 12px; border-radius:10px; border:none; background:var(--accent);
    color:#fff; font-weight:600; font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:6px;
    box-shadow: var(--shadow);}
  .add-btn:active{filter:brightness(.94);}

  .main-wrap{flex:1; min-width:0;}
  .topbar{display:none;}
  main{max-width:980px; margin:0 auto; padding:34px 32px 80px;}
  .view-hd{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .view-hd h1{font-size:22px; margin:0; font-weight:700;}
  .view-sub{color:var(--ink-soft); font-size:12.5px; margin-top:3px;}

  /* ---- Notification banner ---- */
  .banner{display:flex; align-items:center; gap:10px; background:var(--amber-soft); color:var(--amber);
    border:1px solid var(--amber); border-radius:12px; padding:10px 14px; margin-bottom:20px; font-size:13px; font-weight:600;}
  .banner.danger{background:var(--danger-soft); color:var(--danger); border-color:var(--danger);}
  .banner-close{margin-left:auto; background:none; border:none; color:inherit; font-size:15px; opacity:.7; padding:2px 4px;}

  /* ---- Dashboard ---- */
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:26px;}
  @media(max-width:760px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 16px 14px; box-shadow:var(--shadow);}
  .stat-num{font-family:'Sora',sans-serif; font-size:26px; font-weight:700; line-height:1;}
  .stat-label{color:var(--ink-soft); font-size:12px; margin-top:6px;}
  .stat-card.accent .stat-num{color:var(--accent);}
  .stat-card.danger .stat-num{color:var(--danger);}
  .stat-card.green .stat-num{color:var(--green);}

  .dash-grid{display:grid; grid-template-columns:1.35fr 1fr; gap:16px;}
  @media(max-width:820px){.dash-grid{grid-template-columns:1fr;}}
  .panel{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
  .panel + .panel{margin-top:16px;}
  .panel h2{font-size:14.5px; margin:0 0 4px;}
  .panel-sub{color:var(--ink-faint); font-size:11.5px; margin-bottom:12px;}

  .progress-ring-wrap{display:flex; align-items:center; gap:16px;}
  .progress-ring-num{font-family:'Sora',sans-serif; font-size:19px; font-weight:700; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);}
  .ring-box{position:relative; width:92px; height:92px; flex:none;}

  .prio-bars{display:flex; flex-direction:column; gap:8px;}
  .prio-bar-row{display:flex; align-items:center; gap:8px; font-size:12px;}
  .prio-bar-label{width:34px; flex:none; color:var(--ink-soft); font-weight:600;}
  .prio-bar-track{flex:1; height:7px; background:var(--bg-sunk); border-radius:6px; overflow:hidden;}
  .prio-bar-fill{height:100%; border-radius:6px;}
  .prio-bar-count{width:20px; text-align:right; color:var(--ink-faint); flex:none;}

  /* ---- Task list ---- */
  .task-list{display:flex; flex-direction:column;}
  .task-row{display:flex; align-items:flex-start; gap:11px; padding:11px 4px; border-bottom:1px solid var(--border);}
  .task-row:last-child{border-bottom:none;}
  .task-check{width:19px; height:19px; border-radius:6px; border:1.6px solid var(--ink-faint); flex:none;
    margin-top:1px; background:none; display:flex; align-items:center; justify-content:center; padding:0;
    position:relative;}
  .task-check::before{content:"";position:absolute;inset:-13px;} /* 見た目は19pxのまま、タップ領域だけ44px相当に拡張 */
  .task-check svg{width:11px;height:11px; opacity:0; transition:opacity .12s;}
  .task-check.checked{background:var(--accent); border-color:var(--accent);}
  .task-check.checked svg{opacity:1;}
  .task-body{flex:1; min-width:0; cursor:pointer;}
  .task-title{font-weight:500; font-size:13.5px;}
  .task-title.done{color:var(--ink-faint); text-decoration:line-through;}
  .task-title-name{color:var(--accent); font-weight:700;}
  .task-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:5px;}
  .chip{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:20px; white-space:nowrap;}
  .chip-prio-high{background:var(--danger-soft); color:var(--danger);}
  .chip-prio-medium{background:var(--amber-soft); color:var(--amber);}
  .chip-prio-low{background:var(--bg-sunk); color:var(--ink-soft);}
  .chip-due{background:var(--bg-sunk); color:var(--ink-soft);}
  .chip-due.overdue{background:var(--danger-soft); color:var(--danger);}
  .chip-due.today{background:var(--accent-soft); color:var(--accent-ink);}
  .chip-cat{background:var(--bg-sunk); color:var(--ink-soft);}
  .chip-tag{background:none; border:1px solid var(--border); color:var(--ink-faint);}
  .task-actions{display:flex; gap:2px; flex:none; opacity:0; transition:opacity .1s;}
  .task-row:hover .task-actions{opacity:1;}
  .icon-btn{width:26px; height:26px; border:none; background:none; border-radius:7px; color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center; font-size:13px; position:relative;}
  .icon-btn::before{content:"";position:absolute;inset:-9px;}
  .icon-btn:hover{background:var(--bg-sunk); color:var(--ink);}
  .empty{padding:34px 10px; text-align:center; color:var(--ink-faint); font-size:13px;}
  .empty-big{font-size:26px; margin-bottom:8px;}

  /* ---- Toolbar (list view) ---- */
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center;}
  .search-input{flex:1; min-width:160px; padding:9px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg-sunk); color:var(--ink);}
  .search-input::placeholder{color:var(--ink-faint);}
  select.tb-select{padding:8px 10px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--ink);}
  .filter-chip{padding:7px 12px; border-radius:20px; border:1px solid var(--border); background:var(--card);
    font-size:12.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap;}
  .filter-chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .filter-row{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px;}

  /* ---- Kanban ---- */
  .board{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media(max-width:760px){.board{grid-template-columns:1fr; }}
  .board-col{background:var(--bg-sunk); border-radius:var(--radius); padding:12px; min-height:120px;}
  .board-col-hd{display:flex; align-items:center; justify-content:space-between; padding:4px 4px 10px; font-weight:700; font-size:12.5px;}
  .board-col-hd .count{color:var(--ink-faint); font-weight:600;}
  .board-col.drag-over{outline:2px dashed var(--accent); outline-offset:-4px;}
  .kcard{background:var(--card); border:1px solid var(--border); border-radius:11px; padding:11px 12px;
    margin-bottom:9px; box-shadow:var(--shadow); cursor:grab;}
  .kcard:active{cursor:grabbing;}
  .kcard-title{font-size:12.5px; font-weight:600; margin-bottom:7px;}

  /* ---- Calendar ---- */
  .cal-hd{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-nav{display:flex; gap:4px;}
  .cal-nav button{width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--card);}
  .cal-title{font-family:'Sora',sans-serif; font-weight:700; font-size:15px;}

  .cal-grid-v2{border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .cal-dow-row{display:grid; grid-template-columns:repeat(7,1fr);}
  .cal-dow{background:var(--bg-sunk); text-align:center; font-size:10.5px; color:var(--ink-faint); font-weight:700;
    padding:7px 0; border-bottom:1px solid var(--border);}
  .cal-week{border-bottom:1px solid var(--border);}
  .cal-week:last-child{border-bottom:none;}
  .cal-week-daynums{display:grid; grid-template-columns:repeat(7,1fr);}
  .cal-daynum-cell{border-right:1px solid var(--border); padding:5px 6px 2px; font-size:11px;}
  .cal-daynum-cell:nth-child(7n){border-right:none;}
  .cal-daynum-cell.other-month{background:var(--bg-sunk); color:var(--ink-faint);}
  .cal-daynum-cell.is-today .cal-daynum{background:var(--accent); color:#fff; border-radius:50%;}
  .cal-daynum{width:19px; height:19px; display:flex; align-items:center; justify-content:center; font-weight:600;}
  .cal-week-bars{display:flex; flex-direction:column; gap:2px; padding:1px 0 5px;}
  .cal-bar-row{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; padding:0 2px;}
  .cal-bar{font-size:10px; padding:2px 6px; border-radius:5px; color:#fff; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; cursor:grab; font-weight:600;}
  .cal-more{font-size:9.5px; color:var(--ink-faint); padding:1px 4px;}
  .cal-daynum-cell.drag-over{outline:2px dashed var(--accent); outline-offset:-3px;}
  @media(max-width:760px){.cal-daynum-cell{min-height:22px;} .cal-bar{font-size:8.5px;}}

  /* ---- Modal ---- */
  .overlay{position:fixed; inset:0; background:rgba(20,22,30,.42); display:flex; align-items:flex-end;
    justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .14s;}
  .overlay.open{opacity:1; pointer-events:auto;}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:var(--card); width:100%; max-width:480px; border-radius:18px 18px 0 0; max-height:90vh; overflow-y:auto;
    padding:20px 20px 24px; transform:translateY(16px); transition:transform .16s;}
  @media(min-width:640px){.modal{border-radius:18px; transform:translateY(6px);}}
  .overlay.open .modal{transform:translateY(0);}
  .modal-hd{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .modal-hd h2{font-size:16px; margin:0;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:var(--bg-sunk); color:var(--ink);}
  .field textarea{min-height:60px; resize:vertical;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .seg{display:flex; gap:6px;}
  .seg button{flex:1; padding:8px 6px; border-radius:9px; border:1.5px solid var(--border); background:var(--bg-sunk);
    color:var(--ink-soft); font-weight:600; font-size:12px;}
  .seg button.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink);}
  .modal-actions{display:flex; gap:8px; margin-top:18px;}
  .btn{padding:10px 16px; border-radius:10px; border:none; font-weight:600; font-size:13px;}
  .btn-primary{background:var(--accent); color:#fff; flex:1;}
  .btn-ghost{background:var(--bg-sunk); color:var(--ink);}
  .btn-danger-ghost{background:var(--danger-soft); color:var(--danger);}

  /* ---- Settings ---- */
  .settings-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border);}
  .settings-row:last-child{border-bottom:none;}
  .settings-label{font-weight:600; font-size:13px;}
  .settings-sub{color:var(--ink-faint); font-size:11.5px; margin-top:2px;}
  .switch{width:40px; height:23px; border-radius:20px; background:var(--border); border:none; position:relative; flex:none;}
  .switch.on{background:var(--accent);}
  .switch::after{content:"";position:absolute; top:2.5px; left:2.5px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .14s;}
  .switch.on::after{left:19.5px;}

  /* ---- Mobile bottom nav ---- */
  .bottom-nav{display:none;}
  @media(max-width:820px){
    .sidebar{display:none;}
    .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:20;}
    main{padding:20px 16px 90px;}
    .bottom-nav{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:30; justify-content:space-around;}
    .bn-item{display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; color:var(--ink-faint); font-size:9.5px; padding:5px 8px; border-radius:10px;}
    .bn-item.active{color:var(--accent);}
    .bn-icon{font-size:17px;}
  }
  .empty-note{color:var(--ink-faint); font-size:12px;}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">◆</div><div class="brand-name">Focus</div></div>
    <button class="add-btn" id="quickAddBtn">＋ タスクを追加</button>
    <div style="height:14px;"></div>
    <nav class="nav" id="navList"></nav>
    <div class="nav-spacer"></div>
    <div class="sidebar-foot">
      <div style="font-size:10.5px;font-weight:700;color:var(--ink-faint);margin-bottom:6px;">他のアプリ</div>
      <nav style="display:flex;flex-direction:column;gap:2px;">
        <a href="index.html" style="display:flex;align-items:center;min-height:36px;padding:0 8px;border-radius:8px;color:var(--ink-soft);text-decoration:none;font-size:12.5px;">✏️ スキル入力</a>
        <a href="education.html" style="display:flex;align-items:center;min-height:36px;padding:0 8px;border-radius:8px;color:var(--ink-soft);text-decoration:none;font-size:12.5px;">🎓 教育記録</a>
        <a href="viewer2.html" style="display:flex;align-items:center;min-height:36px;padding:0 8px;border-radius:8px;color:var(--ink-soft);text-decoration:none;font-size:12.5px;">📋 閲覧・集計</a>
      </nav>
    </div>
  </aside>

  <div class="main-wrap">
    <div class="topbar">
      <div class="brand"><div class="brand-mark">◆</div><div class="brand-name">Focus</div></div>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="icon-btn" id="settingsBtnMobile" style="width:44px;height:44px;font-size:16px;" title="設定" aria-label="設定を開く">⚙</button>
        <button class="add-btn" id="quickAddBtnMobile" style="width:auto;padding:8px 14px;">＋ 追加</button>
      </div>
    </div>
    <main id="main"></main>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<div class="overlay" id="taskOverlay">
  <div class="modal" id="taskModal"></div>
</div>

<script>
// ============================================================================
// データ層
// ============================================================================
const STORE_KEY = 'focus_tasks_v1';
const THEME_KEY = 'focus_theme_v1';
const SEEDED_KEY = 'focus_seeded_v1';

function uid(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
// 日付だけを扱う関数はUTC変換を挟まない(toISOString()はUTCに変換されるため、日本時間の
// 深夜0時〜8時59分や、addDaysの結果が1日ずれてしまう不具合があった。現地の年月日から直接組み立てる)
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayStr(){ return ymd(new Date()); }
function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); }

function loadTasks(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('読み込みエラー', e); }
  return null;
}
function saveTasks(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(TASKS)); }catch(e){ console.error('保存エラー', e); }
}
function loadTheme(){
  try{ return localStorage.getItem(THEME_KEY) || 'system'; }catch(e){ return 'system'; }
}
function saveTheme(v){
  try{ localStorage.setItem(THEME_KEY, v); }catch(e){}
}
// ↓ 包装課スキルチェックのApps ScriptウェブアプリURL(index.html/viewer2.htmlと同じもの)。

// ============================================================================

// ============================================================================
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function isOverdue(t){ return t.dueDate && t.dueDate < todayStr() && t.status !== 'done'; }
function isDueToday(t){ return t.dueDate === todayStr() && t.status !== 'done'; }
function categories(){ return [...new Set(TASKS.map(t=>t.category).filter(Boolean))]; }
function assignees(){ return [...new Set(TASKS.map(t=>t.assignee).filter(Boolean))]; }
function getTask(id){ return TASKS.find(t=>t.id===id); }

function gasTaskId(t){ return 'gas::' + t.target + '|||' + t.group + '|||' + t.skill + '|||' + t.item; }

// 担当者名から見た目の色を自動で決める(同じ名前なら毎回同じ色になる)。文字を読まなくても色で区別できるように使う
const ASSIGNEE_COLORS = [
  '#4C5FD5','#2F8F5B','#D98E2B','#C0392B','#8E44AD','#16A085','#D35400','#2980B9','#C2185B','#00897B',
];
function hashStr(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return Math.abs(h); }
function colorForAssignee(name){
  if(!name || name==='自分') return null; // 自分のタスクは色分け不要
  return ASSIGNEE_COLORS[hashStr(name) % ASSIGNEE_COLORS.length];
}
function priorityFromLv(lv){
  if(lv === null || lv === undefined) return 'medium';
  if(lv <= 1) return 'high';
  if(lv === 2) return 'medium';
  return 'low';
}
const GAS_STATUS_TO_FOCUS = { not_started:'todo', in_progress:'doing', done:'done' };
const FOCUS_STATUS_TO_GAS = { todo:'not_started', doing:'in_progress', done:'done' };

function mapGasTask(g){
  return {
    id: gasTaskId(g),
    source: 'gas',
    gasKey: { target: g.target, group: g.group, skill: g.skill, item: g.item },
    title: g.item || g.skill,
    notes: g.remarks || '',
    startDate: g.startDate || null,
    dueDate: g.dueDate || null,
    priority: priorityFromLv(g.lv),
    status: GAS_STATUS_TO_FOCUS[g.taskStatus] || 'todo',
    category: g.group,
    assignee: g.target,
    tags: g.skill && g.skill !== g.item ? [g.skill] : [],
    favorite: false,
    createdAt: new Date().toISOString(),
    completedAt: g.taskStatus === 'done' ? new Date().toISOString() : null,
  };
}

async function syncGasTasks(showToastOnDone){
  if(!gasUrl){ return; }
  gasSyncing = true; gasSyncError = '';
  if(document.getElementById('main')) render();
  try{
    const res = await fetch(gasUrl + '?action=allEduTasks', { method:'GET' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    let data;
    try{ data = await res.json(); }catch(parseErr){ throw new Error('応答がJSON形式ではありませんでした'); }

    // 応答本文にstatus:'ok'が無ければ、業務上は失敗として扱う(HTTP 200でもエラーJSONの場合がある)
    if(data.status !== 'ok'){
      throw new Error(data.message || '同期に失敗しました');
    }
    // tasksが無い/配列でない異常な応答を「0件」と誤認して、既存の教育タスクを消してしまわないようにする
    if(!Array.isArray(data.tasks)){
      throw new Error('応答の形式が想定と異なります(tasksが取得できません)');
    }

    const gasTasks = data.tasks.map(mapGasTask).map(t=>({ ...t, syncStatus: 'synced' }));
    // まだサーバーに送信できていない(pending/failed)ローカルの変更は、同期結果で上書きしない
    const pendingLocal = TASKS.filter(t=>t.source==='gas' && (t.syncStatus==='pending' || t.syncStatus==='failed'));
    const pendingIds = new Set(pendingLocal.map(t=>t.id));
    const merged = gasTasks.filter(t=>!pendingIds.has(t.id)).concat(pendingLocal);
    TASKS = TASKS.filter(t=>t.source !== 'gas').concat(merged);
    saveTasks();
    if(showToastOnDone) flashToast(`教育タスクを${gasTasks.length}件同期しました`);
  }catch(e){
    console.error('教育タスクの同期エラー', e);
    gasSyncError = '同期に失敗しました。接続設定のURLを確認してください。';
    // 失敗時はTASKSを一切書き換えない(既存の教育タスクが消えたように見える事故を防ぐ)
  }
  gasSyncing = false;
  render();
}

let gasPushSeq = {}; // タスクごとの送信通し番号(同じタスクを連続で変更したとき、古い応答で新しい状態を巻き戻さないため)

async function pushGasTaskUpdate(t){
  if(!gasUrl || t.source !== 'gas') return;
  const mySeq = (gasPushSeq[t.id] = (gasPushSeq[t.id] || 0) + 1);
  t.syncStatus = 'pending';
  saveTasks();
  try{
    const payload = {
      action: 'updateTask',
      target: t.gasKey.target, group: t.gasKey.group, skill: t.gasKey.skill, item: t.gasKey.item,
      taskStatus: FOCUS_STATUS_TO_GAS[t.status] || 'not_started',
      startDate: t.startDate || '', dueDate: t.dueDate || '', remarks: t.notes || '',
    };
    const res = await fetch(gasUrl, {
      method: 'POST', headers: {'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload),
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    let data;
    try{ data = await res.json(); }catch(parseErr){ throw new Error('応答がJSON形式ではありませんでした'); }
    if(data.status !== 'ok'){ throw new Error(data.message || '保存に失敗しました'); }

    // 送信中に、同じタスクがさらに新しく変更・送信されていた場合、この古い成功応答で状態を上書きしない
    if(gasPushSeq[t.id] !== mySeq) return;
    const current = getTask(t.id);
    if(current) { current.syncStatus = 'synced'; saveTasks(); render(); }
  }catch(e){
    console.error('教育タスクの更新エラー', e);
    if(gasPushSeq[t.id] === mySeq){
      const current = getTask(t.id);
      if(current){ current.syncStatus = 'failed'; saveTasks(); render(); }
      flashToast('⚠️ 保存に失敗しました。ネットワークを確認してもう一度お試しください');
    }
  }
}

}

function taskListHtml(tasks){

  return `<div class="task-list">${tasks.map(taskRowHtml).join('')}</div>`;
}
function taskRowHtml(t){
  const tagsHtml = (t.tags||[]).map(tag=>`<span class="chip chip-tag">#${escapeHtml(tag)}</span>`).join('');
  const isGas = t.source === 'gas';
  const hasName = t.assignee && t.assignee !== '自分';
  const aColor = colorForAssignee(t.assignee);
  const syncBadge = t.syncStatus === 'pending' ? '<span class="chip" style="background:var(--bg-sunk);color:var(--ink-faint);">🔄 保存中...</span>'
    : t.syncStatus === 'failed' ? '<span class="chip" style="background:var(--danger-soft);color:var(--danger);">⚠️ 保存失敗(再試行してください)</span>' : '';
  return `
    <div class="task-row" data-task-id="${t.id}" style="${aColor?`border-left:4px solid ${aColor};padding-left:8px;`:''}">
      <button class="task-check ${t.status==='done'?'checked':''}" data-action="toggle" data-id="${t.id}">
        <svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="task-body" data-action="open" data-id="${t.id}">
        <div class="task-title ${t.status==='done'?'done':''}">${t.favorite?'★ ':''}${isGas?'🔗 ':''}${hasName?`<span class="task-title-name" style="color:${aColor};">${escapeHtml(t.assignee)}：</span>`:''}${escapeHtml(t.title)}</div>
        <div class="task-meta">
          ${prioChipHtml(t)}
          ${dueChipHtml(t)}
          ${t.category?`<span class="chip chip-cat">${escapeHtml(t.category)}</span>`:''}
          ${tagsHtml}
          ${syncBadge}
        </div>
      </div>
      <div class="task-actions">
        ${isGas ? '' : `<button class="icon-btn" data-action="duplicate" data-id="${t.id}" title="複製" aria-label="このタスクを複製">⧉</button>
        <button class="icon-btn" data-action="delete" data-id="${t.id}" title="削除" aria-label="このタスクを削除">🗑</button>`}

// ============================================================================
// タスク一覧ビュー（フィルタ・検索・並び替え）
// ============================================================================
function viewTasks(){
  let list = TASKS.slice();
  const t = todayStr();
  const weekEnd = addDays(t, 7);

  if(listFilter==='today') list = list.filter(x=>x.dueDate===t);
  else if(listFilter==='week') list = list.filter(x=>x.dueDate && x.dueDate>=t && x.dueDate<=weekEnd);
  else if(listFilter==='overdue') list = list.filter(isOverdue);
  else if(listFilter==='todo') list = list.filter(x=>x.status==='todo');
  else if(listFilter==='doing') list = list.filter(x=>x.status==='doing');
  else if(listFilter==='done') list = list.filter(x=>x.status==='done');

  if(listSearch.trim()){
    const q = listSearch.trim().toLowerCase();
    list = list.filter(x=> (x.title+x.notes+(x.tags||[]).join(' ')).toLowerCase().includes(q));
  }

  if(listSortBy==='due') list.sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  else if(listSortBy==='priority'){ const order={high:0,medium:1,low:2}; list.sort((a,b)=>order[a.priority]-order[b.priority]); }
  else if(listSortBy==='created') list.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));

  const filters = [
    ['all','すべて'],['today','今日'],['week','今週'],['overdue','期限切れ'],
    ['todo','未着手'],['doing','進行中'],['done','完了'],
  ];

  return `
    <div class="view-hd"><div><h1>タスク</h1><div class="view-sub">${list.length}件</div></div></div>
    ${bannerHtml()}
    <div class="toolbar">

// ============================================================================
// カレンダー
// ============================================================================
function viewCalendar(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y,m,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();

  // グリッド全セル分の実日付を計算する(前後月のはみ出しセルも含めて、複数日バーが月をまたいでも正しく描画できるように)
  const totalCells = Math.ceil((daysInMonth + startOffset) / 7) * 7;
  const gridStart = new Date(y,m,1 - startOffset);
  const cells = [];
  for(let i=0;i<totalCells;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    cells.push({ dayNum: d.getDate(), other: d.getMonth()!==m, dateStr });
  }

  const dow = ['日','月','火','水','木','金','土'];
  const t = todayStr();

  // 週(7セル)ごとに分割
  const weeks = [];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));

  // 開始日・期限のどちらかがあるタスクを対象に、週ごとの帯(バー)を組み立てる
  const activeTasks = TASKS.filter(x=>x.startDate || x.dueDate);

  const weeksHtml = weeks.map(week=>{
    const weekStart = week[0].dateStr, weekEnd = week[6].dateStr;
    const daynumsHtml = week.map(c=>{
      const isToday = c.dateStr===t;
      return `<div class="cal-daynum-cell ${c.other?'other-month':''} ${isToday?'is-today':''}" data-caldate="${c.dateStr}">
        <div class="cal-daynum">${c.dayNum}</div>
      </div>`;
    }).join('');

    // このタスクがこの週と重なっているか判定し、重なっていれば週内での開始列・終了列を計算する
    const segments = [];
    activeTasks.forEach(task=>{
      const s = task.startDate || task.dueDate;
      const d = task.dueDate || task.startDate;
      if(d < weekStart || s > weekEnd) return; // この週と重ならない
      const colStart = week.findIndex(c=>c.dateStr === (s < weekStart ? weekStart : s));
      const colEnd = week.findIndex(c=>c.dateStr === (d > weekEnd ? weekEnd : d));
      segments.push({ task, colStart: Math.max(0,colStart), colEnd: Math.max(0,colEnd) });
    });
    segments.sort((a,b)=> a.colStart-b.colStart || (b.colEnd-b.colStart)-(a.colEnd-a.colStart));

    // 同じ週の中で日付が重なるタスクは、段(レーン)を分けて表示する(最大3段まで、それ以上は+N件表示)
    const lanes = [];
    const overflowByCol = new Array(7).fill(0);
    segments.forEach(seg=>{
      let laneIdx = lanes.findIndex(lane=> lane.every(s2=> seg.colStart > s2.colEnd || seg.colEnd < s2.colStart));
      if(laneIdx === -1){
        if(lanes.length >= 3){
          for(let c=seg.colStart;c<=seg.colEnd;c++) overflowByCol[c]++;
          return;
        }
        lanes.push([seg]);
      } else {
        lanes[laneIdx].push(seg);
      }
    });

    const barsHtml = lanes.map(lane=> `
      <div class="cal-bar-row">
        ${lane.map(seg=>{
          const task = seg.task;
          const bg = task.status==='done' ? 'var(--green)' : (isOverdue(task) ? 'var(--danger)' : 'var(--accent)');
          const aColor = colorForAssignee(task.assignee);
          const nameLabel = aColor ? `${escapeHtml(task.assignee)}：` : '';
          return `<div class="cal-bar" draggable="true" data-cal-task="${task.id}" title="${escapeAttr(aColor?task.assignee+' - ':'')}${escapeAttr(task.title)}"
            style="grid-column:${seg.colStart+1} / ${seg.colEnd+2};background:${bg};${aColor?`border-left:3px solid ${aColor};`:''}">${task.favorite?'★ ':''}${task.source==='gas'?'🔗 ':''}${nameLabel}${escapeHtml(task.title)}</div>`;
        }).join('')}
      </div>`).join('');

    const overflowHtml = overflowByCol.some(n=>n>0) ? `
      <div class="cal-bar-row">
        ${overflowByCol.map((n,ci)=> n>0 ? `<div class="cal-more" style="grid-column:${ci+1} / ${ci+2};">+${n}件</div>` : '<div></div>').join('')}
      </div>` : '';

    return `<div class="cal-week">
      <div class="cal-week-daynums">${daynumsHtml}</div>
      <div class="cal-week-bars">${barsHtml}${overflowHtml}</div>
    </div>`;
  }).join('');

  return `
    <div class="view-hd"><div><h1>カレンダー</h1><div class="view-sub">開始日〜期限を帯で表示しています</div></div></div>
    ${bannerHtml()}
    <div class="cal-hd">
      <div class="cal-title">${y}年 ${m+1}月</div>
      <div class="cal-nav">
        <button id="calPrev">‹</button>
        <button id="calToday" style="width:auto;padding:0 10px;">今日</button>
        <button id="calNext">›</button>
      </div>
    </div>
    <div class="cal-grid-v2">
      <div class="cal-dow-row">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
      ${weeksHtml}
    </div>
  `;
}

function closeTaskModal(){
  document.getElementById('taskOverlay').classList.remove('open');
  editingTaskId = null;
}
function saveTaskFromModal(){
  const existing = editingTaskId ? getTask(editingTaskId) : null;

  if(existing && existing.source === 'gas'){
    const status = document.getElementById('f-status').querySelector('.active').dataset.val;
    existing.status = status;
    existing.startDate = document.getElementById('f-start').value || null;
    existing.dueDate = document.getElementById('f-due').value || null;
    existing.notes = document.getElementById('f-notes').value;
    existing.completedAt = status==='done' ? new Date().toISOString() : null;
    saveTasks();
    closeTaskModal();
    render();
    pushGasTaskUpdate(existing);
    return;
  }

  const title = document.getElementById('f-title').value.trim();
  if(!title){ document.getElementById('f-title').focus(); return; }
  const priority = document.getElementById('f-priority').querySelector('.active').dataset.val;
  const status = document.getElementById('f-status').querySelector('.active').dataset.val;
  const favorite = document.getElementById('f-favorite').classList.contains('on');
  const tags = document.getElementById('f-tags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const data = {
    title,
    notes: document.getElementById('f-notes').value,
    startDate: document.getElementById('f-start').value || null,
    dueDate: document.getElementById('f-due').value || null,
    priority, status,
    category: document.getElementById('f-category').value.trim(),
    assignee: document.getElementById('f-assignee').value.trim(),
    tags, favorite,
  };
  if(editingTaskId){
    const t = getTask(editingTaskId);
    const wasNotDone = t.status !== 'done';
    Object.assign(t, data);
    if(t.status==='done' && wasNotDone) t.completedAt = new Date().toISOString();
    if(t.status!=='done') t.completedAt = null;
  } else {
    TASKS.unshift({ id: uid(), source:'local', createdAt: new Date().toISOString(), completedAt: status==='done'?new Date().toISOString():null, ...data });
  }
  saveTasks();
  closeTaskModal();
  render();
}

// ============================================================================
// タスク操作
// ============================================================================
function toggleTask(id){
  const t = getTask(id); if(!t) return;
  t.status = t.status==='done' ? 'todo' : 'done';
  t.completedAt = t.status==='done' ? new Date().toISOString() : null;
  saveTasks(); render();
  if(t.source==='gas') pushGasTaskUpdate(t);
}
function deleteTask(id){
  const t = getTask(id);
  if(t && t.source==='gas'){ flashToast('教育タスクはFocusから削除できません（教育チェックシート側で管理してください）'); return; }
  TASKS = TASKS.filter(t=>t.id!==id);
  saveTasks(); render();
}
function duplicateTask(id){
  const t = getTask(id); if(!t) return;
  if(t.source==='gas'){ flashToast('教育タスクは複製できません'); return; }
  const copy = { ...t, id: uid(), title: t.title + 'のコピー', status:'todo', completedAt:null, createdAt:new Date().toISOString() };
  TASKS.unshift(copy);
  saveTasks(); render();
}

// ============================================================================
// イベント配線（描画のたびに呼ぶ）
// ============================================================================
function wireViewEvents(){
  // クイック操作（一覧共通）
  document.querySelectorAll('[data-action="toggle"]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); toggleTask(el.dataset.id); });
  });
  document.querySelectorAll('[data-action="open"]').forEach(el=>{
    el.addEventListener('click', ()=> openTaskModal(el.dataset.id));
  });
  document.querySelectorAll('[data-action="duplicate"]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); duplicateTask(el.dataset.id); });
  });
  document.querySelectorAll('[data-action="delete"]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); if(confirm('このタスクを削除しますか？')) deleteTask(el.dataset.id); });
  });
  const bc = document.getElementById('bannerClose');
  if(bc) bc.addEventListener('click', ()=>{ bannerDismissed = true; render(); });

  // タスク一覧ビュー
  const si = document.getElementById('searchInput');
  if(si){ si.addEventListener('input', ()=>{ listSearch = si.value; render(); si.focus(); si.setSelectionRange(si.value.length, si.value.length); }); }
  const ss = document.getElementById('sortSelect');
  if(ss){ ss.addEventListener('change', ()=>{ listSortBy = ss.value; render(); }); }
  document.querySelectorAll('[data-filter]').forEach(el=>{
    el.addEventListener('click', ()=>{ listFilter = el.dataset.filter; render(); });
  });

  // カレンダー
  const cp = document.getElementById('calPrev'), cn = document.getElementById('calNext'), ct = document.getElementById('calToday');
  if(cp) cp.addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()-1); render(); });
  if(cn) cn.addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()+1); render(); });
  if(ct) ct.addEventListener('click', ()=>{ calMonth = new Date(); calMonth.setDate(1); render(); });
  document.querySelectorAll('[data-cal-task]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); openTaskModal(el.dataset.calTask); });
    el.addEventListener('dragstart', (e)=>{ dragTaskId = el.dataset.calTask; e.dataTransfer.effectAllowed='move'; });
  });
  document.querySelectorAll('[data-caldate]').forEach(el=>{
    el.addEventListener('dragover', (e)=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('drag-over'));
    el.addEventListener('drop', (e)=>{
      e.preventDefault(); el.classList.remove('drag-over');
      if(dragTaskId && el.dataset.caldate){ const t=getTask(dragTaskId); if(t){ t.dueDate = el.dataset.caldate; saveTasks(); render(); if(t.source==='gas') pushGasTaskUpdate(t); } }
      dragTaskId = null;
    });
    el.addEventListener('click', ()=>{
      if(!el.dataset.caldate) return;
      openTaskModal(null);
      document.getElementById('f-due').value = el.dataset.caldate;
      document.getElementById('f-start').value = el.dataset.caldate;
    });
  });

  // ボード（かんばん）
  document.querySelectorAll('[data-kcard]').forEach(el=>{
    el.addEventListener('click', ()=> openTaskModal(el.dataset.kcard));
    el.addEventListener('dragstart', (e)=>{ dragTaskId = el.dataset.kcard; e.dataTransfer.effectAllowed='move'; });
  });
  document.querySelectorAll('[data-col]').forEach(el=>{
    el.addEventListener('dragover', (e)=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('drag-over'));
    el.addEventListener('drop', (e)=>{
      e.preventDefault(); el.classList.remove('drag-over');
      if(dragTaskId){
        const t = getTask(dragTaskId);
        if(t){ t.status = el.dataset.col; t.completedAt = t.status==='done'?new Date().toISOString():null; saveTasks(); render(); if(t.source==='gas') pushGasTaskUpdate(t); }
      }
      dragTaskId = null;
    });
  });

  // 設定
  const themeSel = document.getElementById('themeSelect');
  if(themeSel) themeSel.addEventListener('change', ()=>{ applyTheme(themeSel.value); });
  const exportBtn = document.getElementById('exportCsvBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportCsv);
  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    if(confirm('個人タスクを全て削除します。よろしいですか？（教育タスクは消えません）')){
      TASKS = TASKS.filter(t=>t.source==='gas'); saveTasks(); render();
    }
  });
  const gasSaveBtn = document.getElementById('gasSaveBtn');
  if(gasSaveBtn) gasSaveBtn.addEventListener('click', ()=>{
    const v = document.getElementById('gasUrlInput').value.trim();
    gasUrl = v || DEFAULT_GAS_URL;
    saveGasUrl(v);
    flashToast('接続設定を保存しました');
    render();
  });
  const gasSyncBtn = document.getElementById('gasSyncBtn');
  if(gasSyncBtn) gasSyncBtn.addEventListener('click', ()=> syncGasTasks(true));
  const gasResetUrlBtn = document.getElementById('gasResetUrlBtn');
  if(gasResetUrlBtn) gasResetUrlBtn.addEventListener('click', ()=>{
    try{ localStorage.removeItem(GAS_URL_KEY); }catch(e){}
    gasUrl = DEFAULT_GAS_URL;
    flashToast('初期設定のURLに戻しました');
    render();
  });
}

function exportCsv(){
  const header = ['タスク名','詳細','開始日','期限','優先度','ステータス','カテゴリ','担当者','タグ'];
  const rows = TASKS.map(t=>[t.title,t.notes,t.startDate||'',t.dueDate||'',PRIORITY_LABEL[t.priority],STATUS_LABEL[t.status],t.category,t.assignee,(t.tags||[]).join(' ')]);
  const csv = [header, ...rows].map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tasks.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============================================================================
// テーマ
// ============================================================================
function applyTheme(v){
  saveTheme(v);
  if(v==='system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', v);
}
applyTheme(loadTheme());

// ============================================================================
// 起動
// ============================================================================
document.getElementById('quickAddBtn').addEventListener('click', ()=> openTaskModal(null));
document.getElementById('quickAddBtnMobile').addEventListener('click', ()=> openTaskModal(null));
document.getElementById('settingsBtnMobile').addEventListener('click', ()=>{ currentView = 'settings'; render(); window.scrollTo(0,0); });
document.getElementById('taskOverlay').addEventListener('click', (e)=>{ if(e.target.id==='taskOverlay') closeTaskModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeTaskModal(); });

render();
if(gasUrl) syncGasTasks(false);
</script>
