<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>包装工程 スキルチェック</title>
<style>
  :root{
    --navy:#1F3864;
    --navy-2:#2E4C82;
    --bg:#F3F4F7;
    --card:#FFFFFF;
    --amber:#D98E2B;
    --green:#2F8F5B;
    --text:#1C2430;
    --text-muted:#6B7280;
    --border:#E1E4EA;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  .num{font-family:"DejaVu Sans Mono","SF Mono",monospace;}

  header.top{
    position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;
    padding:14px 16px 12px;box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em;}
  header.top .sub{font-size:11px;opacity:.75;margin-top:2px;}
  .progress-wrap{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .ring{position:relative;width:38px;height:38px;flex:none;}
  .ring svg{transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:4;}
  .ring .bg{stroke:rgba(255,255,255,.25);}
  .ring .fg{stroke:var(--amber);stroke-linecap:round;transition:stroke-dashoffset .3s ease;}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;}
  .progress-text{font-size:12px;opacity:.9;}
  .progress-text b{font-size:14px;}

  main{max-width:520px;margin:0 auto;padding:14px 12px 100px;}
  .mainlike{max-width:520px;margin:0 auto;padding:14px 12px 100px;}

  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    padding:14px;margin-bottom:12px;}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--navy);font-weight:700;}
  .field{margin-bottom:10px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:4px;}
  .field input, .field select{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;
    font-size:15px;background:#FAFBFC;color:var(--text);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--navy-2);outline-offset:1px;}
  .row2{display:flex;gap:8px;}
  .row2 .field{flex:1;}

  .load-btn{
    display:inline-flex;align-items:center;gap:6px;background:#EEF1F6;color:var(--navy);
    border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:12.5px;
    font-weight:600;margin-top:8px;cursor:pointer;
  }
  .load-btn:active{background:#E3E7EE;}

  .group{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    margin-bottom:10px;overflow:hidden;}
  .group-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
    cursor:pointer;user-select:none;}
  .group-hd .name{font-size:14px;font-weight:700;}
  .group-hd .meta{display:flex;align-items:center;gap:8px;}
  .group-hd .count{font-size:11px;color:var(--text-muted);}
  .group-hd .count b{color:var(--navy);}
  .chev{width:9px;height:9px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);
    transform:rotate(45deg);transition:transform .2s ease;margin-right:2px;}
  .group.open .chev{transform:rotate(-135deg);}
  .group-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .group.open .group-body{max-height:4000px;}
  .item{padding:12px 14px;border-top:1px solid var(--border);}
  .item .iname{font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .lv-row{display:flex;gap:6px;margin-bottom:8px;}
  .lv-btn{
    flex:1;aspect-ratio:1;max-height:40px;border-radius:10px;border:1.5px solid var(--border);
    background:#FAFBFC;font-size:15px;font-weight:700;color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .lv-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .sub-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .sub-label{font-size:11.5px;color:var(--text-muted);flex:none;width:60px;}
  .toggle{display:flex;flex:1;border:1.5px solid var(--border);border-radius:9px;overflow:hidden;}
  .toggle button{flex:1;padding:7px 0;font-size:12.5px;font-weight:600;border:none;background:#FAFBFC;
    color:var(--text-muted);cursor:pointer;}
  .toggle button.active.yes{background:var(--green);color:#fff;}
  .toggle button.active.no{background:#9AA1AC;color:#fff;}
  .remarks input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:8px;
    font-size:13px;background:#FAFBFC;color:var(--text);}

  .saved-list{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    padding:12px 14px;margin-bottom:12px;}
  .saved-list h2{font-size:13px;margin:0 0 8px;color:var(--navy);}
  .saved-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;
    border-top:1px solid var(--border);}
  .saved-item:first-of-type{border-top:none;}
  .saved-item .n{font-size:13.5px;font-weight:600;}
  .saved-item .d{font-size:11px;color:var(--text-muted);}
  .saved-item button{background:#EEF1F6;border:1px solid var(--border);border-radius:8px;
    padding:6px 10px;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer;}
  .empty-note{font-size:12px;color:var(--text-muted);}

  .save-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(180deg,rgba(243,244,247,0),var(--bg) 30%);
    padding:14px 12px 16px;display:flex;justify-content:center;}
  .save-btn{max-width:496px;width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(31,56,100,.35);cursor:pointer;}
  .save-btn:active{background:var(--navy-2);}
  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(8px);
    background:var(--text);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
    opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;z-index:60;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  ::selection{background:var(--amber);color:#fff;}

  .legend{display:flex;flex-direction:column;gap:6px;}
  .legend-row{display:flex;align-items:baseline;gap:8px;font-size:12.5px;}
  .legend-row .lvnum{flex:none;width:20px;height:20px;border-radius:6px;background:var(--navy);
    color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .legend-row .lvdesc{color:var(--text);}
  .legend-sd{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

  #lockScreen{
    position:fixed;inset:0;z-index:200;background:var(--navy);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  #lockScreen .box{background:#fff;border-radius:16px;padding:26px 22px;max-width:320px;width:100%;
    box-shadow:0 12px 30px rgba(0,0,0,.3);}
  #lockScreen h2{margin:0 0 6px;font-size:16px;color:var(--navy);}
  #lockScreen p{margin:0 0 16px;font-size:12.5px;color:var(--text-muted);}
  #lockScreen input{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;
    font-size:16px;text-align:center;letter-spacing:.05em;margin-bottom:10px;}
  #lockScreen button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--navy);
    color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;}
  #lockScreen .err{color:#C0392B;font-size:12px;margin-top:8px;display:none;}
  #appRoot{display:block;}

  .tabbar{display:flex;gap:6px;margin-top:12px;}
  .tabbar button{flex:1;padding:9px 0;border:none;border-radius:9px;font-size:13px;font-weight:700;
    background:rgba(255,255,255,.15);color:#fff;cursor:pointer;}
  .tabbar button.active{background:#fff;color:var(--navy);}

  .v-loading{text-align:center;padding:40px 0;color:var(--text-muted);font-size:13px;}
  .v-setup-note{font-size:12px;color:var(--text-muted);line-height:1.6;}
  .v-setup-note code{background:#EEF1F6;padding:1px 5px;border-radius:5px;font-size:11px;}
  .v-person-row{display:flex;align-items:center;justify-content:space-between;
    padding:12px 4px;border-top:1px solid var(--border);cursor:pointer;}
  .v-person-row:first-child{border-top:none;}
  .v-person-row .v-n{font-size:14.5px;font-weight:700;}
  .v-person-row .v-d{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .v-person-row .v-avg{font-size:18px;font-weight:700;color:var(--navy);}
  .v-person-row .v-chev{width:8px;height:8px;border-right:2px solid var(--text-muted);
    border-bottom:2px solid var(--text-muted);transform:rotate(-45deg);margin-left:10px;}
  .v-backbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;}
  .v-backbar .v-arrow{width:9px;height:9px;border-left:2px solid var(--navy);border-bottom:2px solid var(--navy);
    transform:rotate(45deg);}
  .v-backbar span{font-size:13px;color:var(--navy);font-weight:700;}
  .v-detail-hd{margin-bottom:10px;}
  .v-detail-hd .v-n{font-size:19px;font-weight:800;color:var(--navy);}
  .v-detail-hd .v-meta{font-size:12px;color:var(--text-muted);margin-top:3px;}
  .v-group-block{margin-bottom:10px;}
  .v-group-title{font-size:12.5px;font-weight:700;color:var(--navy);
    background:#EEF1F6;padding:7px 10px;border-radius:8px 8px 0 0;}
  .v-item-row{display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px;border-bottom:1px solid var(--border);background:var(--card);font-size:13px;}
  .v-item-row:last-child{border-radius:0 0 8px 8px;}
  .v-item-row .v-iname{flex:1;}
  .v-item-row .v-badges{display:flex;align-items:center;gap:6px;flex:none;}
  .v-lv-badge{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#fff;}
  .v-sd-badge{font-size:10.5px;padding:2px 6px;border-radius:6px;font-weight:600;}
  .v-sd-yes{background:var(--green);color:#fff;}
  .v-sd-no{background:#EEF1F6;color:var(--text-muted);}
  .v-remarks-line{font-size:11.5px;color:var(--text-muted);padding:0 10px 8px;background:var(--card);
    margin-top:-1px;}
  .v-empty-note{font-size:12px;color:var(--text-muted);padding:20px 4px;text-align:center;}
</style>
</head>
<body>

<div id="appRoot">
<header class="top">
  <h1>包装工程 スキルチェック</h1>
  <div class="sub">氏名を入力して各項目のLv・指導経験・備考を記録します</div>
  <div class="progress-wrap">
    <div class="ring">
      <svg width="38" height="38" viewBox="0 0 38 38">
        <circle class="bg" cx="19" cy="19" r="16"></circle>
        <circle class="fg" id="ringFg" cx="19" cy="19" r="16" stroke-dasharray="100.5" stroke-dashoffset="100.5"></circle>
      </svg>
      <div class="pct num" id="ringPct">0%</div>
    </div>
    <div class="progress-text">入力済み <b class="num" id="doneCount">0</b> / <span class="num" id="totalCount">0</span> 項目</div>
  </div>
  <div class="tabbar">
    <button id="tabInputBtn" class="active">✏️ 入力</button>
    <button id="tabViewerBtn">📋 閲覧</button>
  </div>
</header>

<div id="inputView">
<main>
  <div class="card">
    <h2>評価レベル（Lv）の基準</h2>
    <div class="legend">
      <div class="legend-row"><span class="lvnum num">0</span><span class="lvdesc">未経験・未着手</span></div>
      <div class="legend-row"><span class="lvnum num">1</span><span class="lvdesc">教育中（都度指導が必要）</span></div>
      <div class="legend-row"><span class="lvnum num">2</span><span class="lvdesc">一人で作業できる</span></div>
      <div class="legend-row"><span class="lvnum num">3</span><span class="lvdesc">他者に指導できる</span></div>
      <div class="legend-row"><span class="lvnum num">4</span><span class="lvdesc">熟練・工程の管理/教育担当ができる</span></div>
    </div>
    <div class="legend-sd">指導経験：他の従業員へ指導・教育した経験があれば「有」、なければ「無」を選んでください。</div>
  </div>

  <div class="card">
    <h2>基本情報</h2>
    <div class="field">
      <label for="empName">氏名</label>
      <input id="empName" type="text" placeholder="例: 吉井蓮" autocomplete="off">
    </div>
    <div class="row2">
      <div class="field">
        <label for="empLine">所属ライン</label>
        <input id="empLine" type="text" placeholder="例: 瓶包装">
      </div>
      <div class="field">
        <label for="empDate">記入日</label>
        <input id="empDate" type="date">
      </div>
    </div>
    <button class="load-btn" id="loadBtn">↺ この氏名の保存データを読み込む</button>
  </div>

  <div class="saved-list" id="savedListCard" style="display:none;">
    <h2>保存済みデータ一覧</h2>
    <div id="savedListBody"></div>
  </div>

  <div id="groups"></div>
</main>

<div class="save-bar">
  <button class="save-btn" id="saveBtn">保存する</button>
</div>
<div class="toast" id="toast"></div>
</div>

<div id="viewerView" style="display:none;">
  <div class="mainlike">
    <div id="viewerMainArea">
      <div class="card"><div class="v-loading">タブを開くと読み込みます</div></div>
    </div>
  </div>
</div>

<script>
// ここを書き換えると管理者パスワードを変更できます
const ADMIN_PASSWORD = "houso2024";
const ADMIN_KEY = 'skillcheck_admin_unlocked';

function isAdminUnlocked(){
  try{ return sessionStorage.getItem(ADMIN_KEY) === '1'; }catch(e){ return false; }
}
function askAdminPassword(){
  if(isAdminUnlocked()) return true;
  const pw = prompt('保存済みデータを見るには管理者パスワードが必要です');
  if(pw === null) return false;
  if(pw === ADMIN_PASSWORD){
    try{ sessionStorage.setItem(ADMIN_KEY, '1'); }catch(e){}
    return true;
  }
  alert('パスワードが違います');
  return false;
}

const GROUPS = [
  ["2F新カートナー", ["供給","仕上げ","機械操作","型替え","指図記入"]],
  ["旧カートナー", ["供給","仕上げ","機械操作","型替え","指図記入"]],
  ["プラスチベース", ["作業","OP","ラベル巻き","キャップ出し","シュリンク","充填","包装","指図記入"]],
  ["新ライン", ["充填OP","ビン検品工程","仕上げ","機械操作","型替え・品種切り替え","瓶出し","指図記入"]],
  ["旧ライン", ["充填OP","ラベル機","型替え・品種切り替え","指図記入"]],
  ["手作業", ["回転盤","シュリンク","糊付け","仕上げ","ロット押し","指図記入"]],
  ["選別工程", ["選別機1号機","選別機2号機","選別機3号機","選別機4号機","厚み選別機","目視選別機(金属探知機含む)","カプセル選別(ルミナー含む)","指図記入"]],
  ["STP工程", ["STP2","STP3","指図記入"]],
  ["給袋工程", ["仕上げ","OP","指図記入"]],
  ["ピロー", ["供給","機械操作","指図記入"]],
  ["PTP工程", ["検品","機械操作","指図記入"]],
];

const TOTAL_ITEMS = GROUPS.reduce((s,[,items])=>s+items.length,0);
document.getElementById('totalCount').textContent = TOTAL_ITEMS;

const state = {}; // key "group|item" -> {lv:null, sd:null, remarks:""}
GROUPS.forEach(([g,items])=>items.forEach(it=>{ state[g+'|'+it] = {lv:null, sd:null, remarks:""}; }));

const RING_CIRC = 100.5;

function render(){
  const wrap = document.getElementById('groups');
  wrap.innerHTML = '';
  GROUPS.forEach(([gname, items], gi) => {
    const filled = items.filter(it => state[gname+'|'+it].lv !== null).length;
    const div = document.createElement('div');
    div.className = 'group';
    div.dataset.idx = gi;
    div.innerHTML = `
      <div class="group-hd" data-toggle="${gi}">
        <div class="name">${gname}</div>
        <div class="meta">
          <div class="count"><b class="fillcount">${filled}</b>/${items.length}</div>
          <div class="chev"></div>
        </div>
      </div>
      <div class="group-body">
        ${items.map(it => itemHtml(gname, it)).join('')}
      </div>`;
    wrap.appendChild(div);
  });

  wrap.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      el.closest('.group').classList.toggle('open');
    });
  });
  wrap.querySelectorAll('.lv-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.key, lv = parseInt(btn.dataset.lv,10);
      state[key].lv = (state[key].lv === lv) ? null : lv;
      render(); restoreOpenGroups();
      updateProgress();
    });
  });
  wrap.querySelectorAll('.toggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.key, val = btn.dataset.val;
      state[key].sd = (state[key].sd === val) ? null : val;
      render(); restoreOpenGroups();
      updateProgress();
    });
  });
  wrap.querySelectorAll('.remarks input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      state[inp.dataset.key].remarks = inp.value;
    });
    inp.addEventListener('click', e=>e.stopPropagation());
  });
  updateProgress();
}

function itemHtml(gname, it){
  const key = gname+'|'+it;
  const s = state[key];
  const lvBtns = [0,1,2,3,4].map(n=>`<div class="lv-btn ${s.lv===n?'active':''} num" data-key="${key}" data-lv="${n}">${n}</div>`).join('');
  return `
    <div class="item">
      <div class="iname">${it}</div>
      <div class="lv-row">${lvBtns}</div>
      <div class="sub-row">
        <div class="sub-label">指導経験</div>
        <div class="toggle">
          <button data-key="${key}" data-val="有" class="${s.sd==='有'?'active yes':''}">有</button>
          <button data-key="${key}" data-val="無" class="${s.sd==='無'?'active no':''}">無</button>
        </div>
      </div>
      <div class="remarks">
        <input type="text" placeholder="備考(任意)" value="${escapeAttr(s.remarks)}" data-key="${key}">
      </div>
    </div>`;
}

function escapeAttr(str){
  return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

let openSet = new Set();
function restoreOpenGroups(){
  document.querySelectorAll('.group').forEach(g=>{
    if(openSet.has(g.dataset.idx)) g.classList.add('open');
  });
}
document.getElementById('groups').addEventListener('click', (e)=>{
  const hd = e.target.closest('[data-toggle]');
  if(hd){
    const idx = hd.dataset.toggle;
    if(openSet.has(idx)) openSet.delete(idx); else openSet.add(idx);
  }
});

function updateProgress(){
  const done = Object.values(state).filter(s=>s.lv!==null).length;
  document.getElementById('doneCount').textContent = done;
  const pct = TOTAL_ITEMS ? Math.round(done/TOTAL_ITEMS*100) : 0;
  document.getElementById('ringPct').textContent = pct+'%';
  const offset = RING_CIRC - (RING_CIRC*pct/100);
  document.getElementById('ringFg').style.strokeDashoffset = offset;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// ↓ Googleスプレッドシートに送信する場合、ここにApps Scriptの「ウェブアプリURL」を貼り付けてください
// 空欄のままなら、この端末内だけの保存(今まで通り)になります。
const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyd-vNr3wXMGqx0ynXh02Dx1Ms3z9-uRsSRWSFU5dSZAax6PWEmsbPoJhzLpThuTnE2/exec";

function resetForm(){
  document.getElementById('empName').value = '';
  document.getElementById('empLine').value = '';
  const today = new Date();
  document.getElementById('empDate').value = today.toISOString().slice(0,10);
  Object.keys(state).forEach(k=>{ state[k] = {lv:null, sd:null, remarks:""}; });
  openSet = new Set();
  render();
}

function sendToSheet(record){
  if(!SHEET_WEBAPP_URL) return;
  const rows = [];
  GROUPS.forEach(([gname, items])=>{
    items.forEach(it=>{
      const s = record.items[gname+'|'+it] || {};
      rows.push({group:gname, item:it, lv:s.lv, sd:s.sd, remarks:s.remarks||""});
    });
  });
  const payload = {
    name: record.name, line: record.line, date: record.date, items: rows,
  };
  fetch(SHEET_WEBAPP_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload),
  }).catch(e=>console.error('sheet送信エラー', e));
}

async function saveData(){
  const name = document.getElementById('empName').value.trim();
  if(!name){ showToast('氏名を入力してください'); return; }
  const record = {
    name,
    line: document.getElementById('empLine').value.trim(),
    date: document.getElementById('empDate').value,
    items: state,
    updatedAt: new Date().toISOString(),
  };
  try{
    localStorage.setItem('checklist:'+name, JSON.stringify(record));
    let idx = JSON.parse(localStorage.getItem('employee_index') || '[]');
    if(!idx.includes(name)) idx.push(name);
    localStorage.setItem('employee_index', JSON.stringify(idx));
    sendToSheet(record);
    showToast('保存しました');
    loadSavedList();
    resetForm();
  }catch(e){
    showToast('保存に失敗しました');
    console.error(e);
  }
}

function safeGet(key){
  try{
    const v = localStorage.getItem(key);
    return v === null ? null : {key, value: v};
  }catch(e){ return null; }
}

async function loadByName(name){
  if(!askAdminPassword()) return;
  const res = safeGet('checklist:'+name);
  if(!res){ showToast('保存データが見つかりません'); return; }
  const record = JSON.parse(res.value);
  document.getElementById('empName').value = record.name || '';
  document.getElementById('empLine').value = record.line || '';
  document.getElementById('empDate').value = record.date || '';
  Object.keys(state).forEach(k=>{
    if(record.items && record.items[k]){
      state[k] = Object.assign({lv:null,sd:null,remarks:""}, record.items[k]);
    } else {
      state[k] = {lv:null, sd:null, remarks:""};
    }
  });
  render();
  showToast(name + ' のデータを読み込みました');
}

function renderSavedListLocked(){
  const card = document.getElementById('savedListCard');
  const body = document.getElementById('savedListBody');
  const idx = JSON.parse(localStorage.getItem('employee_index') || '[]');
  if(!idx.length){ card.style.display='none'; return; }
  card.style.display='block';
  body.innerHTML = `<button class="load-btn" id="adminRevealBtn">🔒 管理者パスワードで一覧を見る</button>`;
  document.getElementById('adminRevealBtn').addEventListener('click', ()=>{
    if(askAdminPassword()) renderSavedListUnlocked();
  });
}

function renderSavedListUnlocked(){
  const card = document.getElementById('savedListCard');
  const body = document.getElementById('savedListBody');
  const idx = JSON.parse(localStorage.getItem('employee_index') || '[]');
  card.style.display='block';
  const rows = idx.map(name=>{
    const res = safeGet('checklist:'+name);
    if(!res) return null;
    const r = JSON.parse(res.value);
    const done = Object.values(r.items||{}).filter(v=>v && v.lv!==null).length;
    return {name, date:r.date||'', done};
  });
  body.innerHTML = rows.filter(Boolean).map(r=>`
    <div class="saved-item">
      <div>
        <div class="n">${r.name}</div>
        <div class="d">${r.date||'日付未記入'}・入力済み ${r.done}/${TOTAL_ITEMS}項目</div>
      </div>
      <button data-load="${r.name}">読み込む</button>
    </div>`).join('') || '<div class="empty-note">まだ保存データがありません</div>';
  body.querySelectorAll('[data-load]').forEach(btn=>{
    btn.addEventListener('click', ()=> loadByName(btn.dataset.load));
  });
}

async function loadSavedList(){
  if(isAdminUnlocked()) renderSavedListUnlocked();
  else renderSavedListLocked();
}

document.getElementById('saveBtn').addEventListener('click', saveData);
document.getElementById('loadBtn').addEventListener('click', ()=>{
  const name = document.getElementById('empName').value.trim();
  if(!name){ showToast('氏名を入力してください'); return; }
  loadByName(name);
});

// 初期化
(function init(){
  const today = new Date();
  const iso = today.toISOString().slice(0,10);
  document.getElementById('empDate').value = iso;
  render();
  loadSavedList();
})();

// ---------------------------------------------------------------------------
// 閲覧タブ(スプレッドシートの提出データを見る)
// ---------------------------------------------------------------------------
const V_GROUP_ORDER = [
  "2F新カートナー","旧カートナー","プラスチベース","新ライン","旧ライン",
  "手作業","選別工程","STP工程","給袋工程","ピロー","PTP工程",
];

function vLvColor(lv){
  if(lv === null || lv === undefined || lv === "") return "#C9CDD4";
  const n = Number(lv);
  const stops = ["#B0B4BA","#C9C267","#E0C24C","#8FBF6B","#2F8F5B"];
  return stops[Math.max(0, Math.min(4, n))];
}

function vEscapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let V_PEOPLE = [];

async function loadViewerData(){
  const main = document.getElementById('viewerMainArea');
  if(!SHEET_WEBAPP_URL){
    main.innerHTML = `<div class="card"><h2>設定が必要です</h2>
      <div class="v-setup-note">SHEET_WEBAPP_URLが未設定です。</div></div>`;
    return;
  }
  main.innerHTML = `<div class="card"><div class="v-loading">読み込み中...</div></div>`;
  try{
    const res = await fetch(SHEET_WEBAPP_URL, { method: 'GET' });
    const data = await res.json();
    V_PEOPLE = data.people || [];
    renderViewerList();
  }catch(e){
    main.innerHTML = `<div class="card"><h2>読み込みに失敗しました</h2>
      <div class="v-setup-note">通信環境を確認するか、時間をおいて開き直してください。</div></div>`;
    console.error(e);
  }
}

function vLatestBlock(rows){
  let lastStart = 0;
  rows.forEach((r, i)=>{ if(r.ts) lastStart = i; });
  return rows.slice(lastStart);
}

function vAvgLv(rows){
  const vals = rows.filter(r=>r.lv !== null && r.lv !== "").map(r=>Number(r.lv));
  if(!vals.length) return null;
  return (vals.reduce((a,b)=>a+b,0) / vals.length).toFixed(2);
}

function renderViewerList(){
  const main = document.getElementById('viewerMainArea');
  if(!V_PEOPLE.length){
    main.innerHTML = `<div class="card"><div class="v-empty-note">まだ提出データがありません</div></div>`;
    return;
  }
  const rowsHtml = V_PEOPLE.map((p, idx)=>{
    const block = vLatestBlock(p.rows);
    const avg = vAvgLv(block);
    const date = block[0] && block[0].date ? block[0].date : '';
    return `
      <div class="v-person-row" data-idx="${idx}">
        <div>
          <div class="v-n">${vEscapeHtml(p.name)}</div>
          <div class="v-d">${date || '日付未記入'}</div>
        </div>
        <div style="display:flex;align-items:center;">
          <div class="v-avg num">${avg === null ? '-' : avg}</div>
          <div class="v-chev"></div>
        </div>
      </div>`;
  }).join('');
  main.innerHTML = `<div class="card"><h2>提出済み一覧（${V_PEOPLE.length}人）</h2>${rowsHtml}</div>`;
  main.querySelectorAll('.v-person-row').forEach(el=>{
    el.addEventListener('click', ()=> renderViewerDetail(Number(el.dataset.idx)));
  });
}

function renderViewerDetail(idx){
  const main = document.getElementById('viewerMainArea');
  const p = V_PEOPLE[idx];
  const block = vLatestBlock(p.rows);
  const line = block[0] ? block[0].line : '';
  const date = block[0] ? block[0].date : '';
  const avg = vAvgLv(block);

  const byGroup = {};
  block.forEach(r=>{
    if(!byGroup[r.group]) byGroup[r.group] = [];
    byGroup[r.group].push(r);
  });
  const groups = V_GROUP_ORDER.filter(g=>byGroup[g]).concat(Object.keys(byGroup).filter(g=>!V_GROUP_ORDER.includes(g)));

  const groupsHtml = groups.map(g=>{
    const items = byGroup[g].map(r=>{
      const lv = r.lv === null || r.lv === "" ? "-" : r.lv;
      const sdClass = r.sd === "有" ? "v-sd-yes" : "v-sd-no";
      const remarksHtml = r.remarks ? `<div class="v-remarks-line">💬 ${vEscapeHtml(r.remarks)}</div>` : '';
      return `
        <div class="v-item-row">
          <div class="v-iname">${vEscapeHtml(r.item)}</div>
          <div class="v-badges">
            <div class="v-lv-badge num" style="background:${vLvColor(r.lv)}">${lv}</div>
            <div class="v-sd-badge ${sdClass}">${r.sd || '無'}</div>
          </div>
        </div>${remarksHtml}`;
    }).join('');
    return `<div class="v-group-block"><div class="v-group-title">${g}</div>${items}</div>`;
  }).join('');

  main.innerHTML = `
    <div class="v-backbar" id="vBackBtn"><div class="v-arrow"></div><span>一覧に戻る</span></div>
    <div class="card">
      <div class="v-detail-hd">
        <div class="v-n">${vEscapeHtml(p.name)}</div>
        <div class="v-meta">${line || '所属未記入'}　${date || ''}　総合平均: <b class="num">${avg === null ? '-' : avg}</b></div>
      </div>
    </div>
    ${groupsHtml}
  `;
  document.getElementById('vBackBtn').addEventListener('click', renderViewerList);
}

// タブ切り替え
const tabInputBtn = document.getElementById('tabInputBtn');
const tabViewerBtn = document.getElementById('tabViewerBtn');
const inputView = document.getElementById('inputView');
const viewerView = document.getElementById('viewerView');

tabInputBtn.addEventListener('click', ()=>{
  tabInputBtn.classList.add('active');
  tabViewerBtn.classList.remove('active');
  inputView.style.display = 'block';
  viewerView.style.display = 'none';
});
tabViewerBtn.addEventListener('click', ()=>{
  tabViewerBtn.classList.add('active');
  tabInputBtn.classList.remove('active');
  inputView.style.display = 'none';
  viewerView.style.display = 'block';
  loadViewerData();
});
</script>
