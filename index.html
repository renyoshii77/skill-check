<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>包装工程 スキルチェック</title>
<style>
  :root{
    --navy:#1F3864;
    --navy-2:#2E4C82;
    --bg:#F3F4F7;
    --card:#FFFFFF;
    --amber:#D98E2B;
    --green:#2F8F5B;
    --text:#1C2430;
    --text-muted:#6B7280;
    --border:#E1E4EA;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  .num{font-family:"DejaVu Sans Mono","SF Mono",monospace;}

  header.top{
    position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;
    padding:14px 16px 12px;box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em;}
  header.top .sub{font-size:11px;opacity:.75;margin-top:2px;}
  .progress-wrap{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .ring{position:relative;width:38px;height:38px;flex:none;}
  .ring svg{transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:4;}
  .ring .bg{stroke:rgba(255,255,255,.25);}
  .ring .fg{stroke:var(--amber);stroke-linecap:round;transition:stroke-dashoffset .3s ease;}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;}
  .progress-text{font-size:12px;opacity:.9;}
  .progress-text b{font-size:14px;}

  main{max-width:520px;margin:0 auto;padding:14px 12px 100px;}
  .mainlike{max-width:520px;margin:0 auto;padding:14px 12px 100px;}

  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    padding:14px;margin-bottom:12px;}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--navy);font-weight:700;}
  .field{margin-bottom:10px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:4px;}
  .field input, .field select{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;
    font-size:15px;background:#FAFBFC;color:var(--text);
    height:42px;box-sizing:border-box;-webkit-appearance:none;appearance:none;
    line-height:normal;
  }
  .field input[type="date"]{padding:9px 10px;}
  .field input:focus, .field select:focus{outline:2px solid var(--navy-2);outline-offset:1px;}
  .row2{display:flex;gap:8px;align-items:flex-end;}
  .row2 .field{flex:1;min-width:0;}
  .row2 .field input{width:100%;min-width:0;}

  .load-btn{
    display:inline-flex;align-items:center;gap:6px;background:#EEF1F6;color:var(--navy);
    border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:12.5px;
    font-weight:600;margin-top:8px;cursor:pointer;
  }
  .load-btn:active{background:#E3E7EE;}

  .group{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    margin-bottom:10px;overflow:hidden;}
  .group-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
    cursor:pointer;user-select:none;}
  .group-hd .name{font-size:14px;font-weight:700;}
  .group-hd .meta{display:flex;align-items:center;gap:8px;}
  .group-hd .count{font-size:11px;color:var(--text-muted);}
  .group-hd .count b{color:var(--navy);}
  .chev{width:9px;height:9px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);
    transform:rotate(45deg);transition:transform .2s ease;margin-right:2px;}
  .group.open .chev{transform:rotate(-135deg);}
  .group-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .group.open .group-body{max-height:4000px;}
  .item{padding:12px 14px;border-top:1px solid var(--border);}
  .item .iname{font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .lv-row{display:flex;gap:6px;margin-bottom:8px;}
  .lv-btn{
    flex:1;aspect-ratio:1;max-height:40px;border-radius:10px;border:1.5px solid var(--border);
    background:#FAFBFC;font-size:15px;font-weight:700;color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .lv-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .lv-btn.active[data-lv="0"]{background:#B0B4BA;border-color:#B0B4BA;}
  .lv-btn.active[data-lv="1"]{background:#CBBE8A;border-color:#CBBE8A;}
  .lv-btn.active[data-lv="2"]{background:#D9A94E;border-color:#D9A94E;}
  .lv-btn.active[data-lv="3"]{background:#8FBF6B;border-color:#8FBF6B;}
  .lv-btn.active[data-lv="4"]{background:#2F8F5B;border-color:#2F8F5B;}
  .sub-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .sub-label{font-size:11.5px;color:var(--text-muted);flex:none;width:60px;}
  .toggle{display:flex;flex:1;border:1.5px solid var(--border);border-radius:9px;overflow:hidden;}
  .toggle button{flex:1;padding:7px 0;font-size:12.5px;font-weight:600;border:none;background:#FAFBFC;
    color:var(--text-muted);cursor:pointer;}
  .toggle button.active.yes{background:var(--green);color:#fff;}
  .toggle button.active.no{background:#9AA1AC;color:#fff;}
  .remarks input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:8px;
    font-size:13px;background:#FAFBFC;color:var(--text);}

  .saved-list{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    padding:12px 14px;margin-bottom:12px;}
  .saved-list h2{font-size:13px;margin:0 0 8px;color:var(--navy);}
  .saved-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;
    border-top:1px solid var(--border);}
  .saved-item:first-of-type{border-top:none;}
  .saved-item .n{font-size:13.5px;font-weight:600;}
  .saved-item .d{font-size:11px;color:var(--text-muted);}
  .saved-item button{background:#EEF1F6;border:1px solid var(--border);border-radius:8px;
    padding:6px 10px;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer;}
  .empty-note{font-size:12px;color:var(--text-muted);}

  .save-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(180deg,rgba(243,244,247,0),var(--bg) 30%);
    padding:14px 12px 16px;display:flex;justify-content:center;}
  .save-btn{max-width:496px;width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(31,56,100,.35);cursor:pointer;}
  .save-btn:active{background:var(--navy-2);}
  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(8px);
    background:var(--text);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
    opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;z-index:60;
    max-width:88vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  ::selection{background:var(--amber);color:#fff;}

  .legend{display:flex;flex-direction:column;gap:6px;}
  .legend-row{display:flex;align-items:baseline;gap:8px;font-size:12.5px;}
  .legend-row .lvnum{flex:none;width:20px;height:20px;border-radius:6px;background:var(--navy);
    color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .legend-row .lvdesc{color:var(--text);}
  .legend-sd{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

  #lockScreen{
    position:fixed;inset:0;z-index:200;background:var(--navy);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  #lockScreen .box{background:#fff;border-radius:16px;padding:26px 22px;max-width:320px;width:100%;
    box-shadow:0 12px 30px rgba(0,0,0,.3);}
  #lockScreen h2{margin:0 0 6px;font-size:16px;color:var(--navy);}
  #lockScreen p{margin:0 0 16px;font-size:12.5px;color:var(--text-muted);}
  #lockScreen input{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;
    font-size:16px;text-align:center;letter-spacing:.05em;margin-bottom:10px;}
  #lockScreen button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--navy);
    color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;}
  #lockScreen .err{color:#C0392B;font-size:12px;margin-top:8px;display:none;}
  #appRoot{display:block;}

</style>
</head>
<body>

<div id="appRoot">
<header class="top">
  <h1>包装工程 スキルチェック</h1>
  <div class="sub">氏名を入力して各項目のLv・指導経験・備考を記録します</div>
  <div class="progress-wrap">
    <div class="ring">
      <svg width="38" height="38" viewBox="0 0 38 38">
        <circle class="bg" cx="19" cy="19" r="16"></circle>
        <circle class="fg" id="ringFg" cx="19" cy="19" r="16" stroke-dasharray="100.5" stroke-dashoffset="100.5"></circle>
      </svg>
      <div class="pct num" id="ringPct">0%</div>
    </div>
    <div class="progress-text">入力済み <b class="num" id="doneCount">0</b> / <span class="num" id="totalCount">0</span> 項目</div>
  </div>
</header>

<main>
  <div class="card">
    <h2>評価レベル（Lv）の基準</h2>
    <div class="legend">
      <div class="legend-row"><span class="lvnum num">0</span><span class="lvdesc">未経験・未着手</span></div>
      <div class="legend-row"><span class="lvnum num">1</span><span class="lvdesc">微妙（一人でできるか怪しい）</span></div>
      <div class="legend-row"><span class="lvnum num">2</span><span class="lvdesc">一人で作業できる</span></div>
      <div class="legend-row"><span class="lvnum num">3</span><span class="lvdesc">他者に指導できる</span></div>
      <div class="legend-row"><span class="lvnum num">4</span><span class="lvdesc">熟練・工程の管理/教育担当ができる</span></div>
    </div>
    <div class="legend-sd">指導経験：他の従業員へ指導・教育した経験があれば「有」、なければ「無」を選んでください。</div>
  </div>

  <div class="card">
    <h2>基本情報</h2>
    <div class="field">
      <label for="empName">氏名</label>
      <input id="empName" type="text" placeholder="例: 吉井蓮" autocomplete="off">
    </div>
    <div class="field">
      <label for="empLine">所属ライン</label>
      <input id="empLine" type="text" placeholder="例: 瓶包装" autocomplete="off">
    </div>
    <div class="field">
      <label for="empDate">記入日</label>
      <input id="empDate" type="date">
    </div>
    <div class="field">
      <label for="empHireDate">入社日</label>
      <input id="empHireDate" type="date">
    </div>
    <div class="field">
      <label>社歴（自動計算）</label>
      <input id="empTenure" type="text" readonly placeholder="自動計算" style="background:#EEF1F6;color:var(--text-muted);font-size:13px;">
    </div>
  </div>

  <div id="groups"></div>
</main>

<div class="save-bar">
  <button class="save-btn" id="saveBtn">保存する</button>
</div>
<div class="toast" id="toast"></div>

<script>

const GROUPS = [
  ["2F新カートナー", ["供給","仕上げ","機械操作","型替え","指図記入"]],
  ["旧カートナー", ["供給","仕上げ","機械操作","型替え","指図記入"]],
  ["プラスチベース", ["作業","OP","ラベル巻き","キャップ出し","シュリンク","充填","包装","指図記入"]],
  ["新ライン", ["充填OP","ビン検品工程","仕上げ","機械操作","型替え・品種切り替え","瓶出し","指図記入"]],
  ["旧ライン", ["充填OP","ラベル機","型替え・品種切り替え","指図記入"]],
  ["手作業", ["回転盤","シュリンク","糊付け","仕上げ","ロット押し","指図記入"]],
  ["選別工程", ["選別機1号機","選別機2号機","選別機3号機","選別機4号機","厚み選別機","目視選別機(金属探知機含む)","カプセル選別(ルミナー含む)","指図記入"]],
  ["STP工程", ["STP2","STP3","指図記入"]],
  ["給袋工程", ["仕上げ","OP","指図記入"]],
  ["ピロー", ["供給","機械操作","指図記入"]],
  ["PTP工程", ["検品","機械操作","指図記入"]],
];

const TOTAL_ITEMS = GROUPS.reduce((s,[,items])=>s+items.length,0);
document.getElementById('totalCount').textContent = TOTAL_ITEMS;

const state = {}; // key "group|item" -> {lv:null, sd:null, remarks:""}
GROUPS.forEach(([g,items])=>items.forEach(it=>{ state[g+'|'+it] = {lv:null, sd:null, remarks:""}; }));

const RING_CIRC = 100.5;

function render(){
  const wrap = document.getElementById('groups');
  wrap.innerHTML = '';
  GROUPS.forEach(([gname, items], gi) => {
    const filled = items.filter(it => state[gname+'|'+it].lv !== null).length;
    const div = document.createElement('div');
    div.className = 'group';
    div.dataset.idx = gi;
    div.innerHTML = `
      <div class="group-hd" data-toggle="${gi}">
        <div class="name">${gname}</div>
        <div class="meta">
          <div class="count"><b class="fillcount">${filled}</b>/${items.length}</div>
          <div class="chev"></div>
        </div>
      </div>
      <div class="group-body">
        ${items.map(it => itemHtml(gname, it)).join('')}
      </div>`;
    wrap.appendChild(div);
  });

  wrap.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      el.closest('.group').classList.toggle('open');
    });
  });
  wrap.querySelectorAll('.lv-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.key, lv = parseInt(btn.dataset.lv,10);
      state[key].lv = (state[key].lv === lv) ? null : lv;
      render(); restoreOpenGroups();
      updateProgress();
    });
  });
  wrap.querySelectorAll('.toggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.key, val = btn.dataset.val;
      state[key].sd = (state[key].sd === val) ? null : val;
      render(); restoreOpenGroups();
      updateProgress();
    });
  });
  wrap.querySelectorAll('.remarks input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      state[inp.dataset.key].remarks = inp.value;
    });
    inp.addEventListener('click', e=>e.stopPropagation());
  });
  updateProgress();
}

function itemHtml(gname, it){
  const key = gname+'|'+it;
  const s = state[key];
  const lvBtns = [0,1,2,3,4].map(n=>`<div class="lv-btn ${s.lv===n?'active':''} num" data-key="${key}" data-lv="${n}">${n}</div>`).join('');
  return `
    <div class="item">
      <div class="iname">${it}</div>
      <div class="lv-row">${lvBtns}</div>
      <div class="sub-row">
        <div class="sub-label">指導経験</div>
        <div class="toggle">
          <button data-key="${key}" data-val="有" class="${s.sd==='有'?'active yes':''}">有</button>
          <button data-key="${key}" data-val="無" class="${s.sd==='無'?'active no':''}">無</button>
        </div>
      </div>
      <div class="remarks">
        <input type="text" placeholder="備考(任意)" value="${escapeAttr(s.remarks)}" data-key="${key}">
      </div>
    </div>`;
}

function escapeAttr(str){
  return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

let openSet = new Set();
function restoreOpenGroups(){
  document.querySelectorAll('.group').forEach(g=>{
    if(openSet.has(g.dataset.idx)) g.classList.add('open');
  });
}
document.getElementById('groups').addEventListener('click', (e)=>{
  const hd = e.target.closest('[data-toggle]');
  if(hd){
    const idx = hd.dataset.toggle;
    if(openSet.has(idx)) openSet.delete(idx); else openSet.add(idx);
  }
});

function updateProgress(){
  const done = Object.values(state).filter(s=>s.lv!==null).length;
  document.getElementById('doneCount').textContent = done;
  const pct = TOTAL_ITEMS ? Math.round(done/TOTAL_ITEMS*100) : 0;
  document.getElementById('ringPct').textContent = pct+'%';
  const offset = RING_CIRC - (RING_CIRC*pct/100);
  document.getElementById('ringFg').style.strokeDashoffset = offset;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3200);
}

// ↓ Googleスプレッドシートに送信する場合、ここにApps Scriptの「ウェブアプリURL」を貼り付けてください
// 空欄のままなら、この端末内だけの保存(今まで通り)になります。
const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyWqNJuUujq0mLxNXz9gqnu2AOCuqOK5kSXaEBbLYBEOkI7n0QnbYtgoP-0aOg7_LTk/exec";

function resetForm(){
  document.getElementById('empName').value = '';
  document.getElementById('empLine').value = '';
  document.getElementById('empHireDate').value = '';
  document.getElementById('empTenure').value = '';
  const today = new Date();
  document.getElementById('empDate').value = today.toISOString().slice(0,10);
  Object.keys(state).forEach(k=>{ state[k] = {lv:null, sd:null, remarks:""}; });
  openSet = new Set();
  render();
}

// 入社日から社歴を計算(Excel側の =ROUNDDOWN((TODAY-入社日)/365,1) と同じ考え方)
function calcTenureText(hireDateStr){
  if(!hireDateStr) return '';
  const hire = new Date(hireDateStr + 'T00:00:00');
  if(isNaN(hire.getTime())) return '';
  const today = new Date();
  const years = Math.floor(((today - hire) / (1000*60*60*24*365)) * 10) / 10;
  if(years < 0) return '';
  return '社歴' + years.toFixed(1) + '年';
}

function updateTenureDisplay(){
  document.getElementById('empTenure').value = calcTenureText(document.getElementById('empHireDate').value);
}
document.getElementById('empHireDate').addEventListener('change', updateTenureDisplay);

function sendToSheet(record){
  if(!SHEET_WEBAPP_URL) return;
  const rows = [];
  GROUPS.forEach(([gname, items])=>{
    items.forEach(it=>{
      const s = record.items[gname+'|'+it] || {};
      rows.push({group:gname, item:it, lv:s.lv, sd:s.sd, remarks:s.remarks||""});
    });
  });
  const payload = {
    name: record.name, line: record.line, date: record.date, hireDate: record.hireDate, items: rows,
  };
  fetch(SHEET_WEBAPP_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload),
  }).catch(e=>console.error('sheet送信エラー', e));
}

async function saveData(){
  const name = document.getElementById('empName').value.trim();
  if(!name){ showToast('氏名を入力してください'); return; }
  const record = {
    name,
    line: document.getElementById('empLine').value.trim(),
    date: document.getElementById('empDate').value,
    hireDate: document.getElementById('empHireDate').value,
    items: state,
    updatedAt: new Date().toISOString(),
  };
  try{
    sendToSheet(record);
    const hireLabel = record.hireDate ? ('入社日:'+record.hireDate) : '入社日:未入力';
    showToast('保存しました（'+hireLabel+'）');
    resetForm();
  }catch(e){
    showToast('保存に失敗しました');
    console.error(e);
  }
}

document.getElementById('saveBtn').addEventListener('click', saveData);

// 氏名欄からフォーカスが外れたとき、スプレッドシートに同じ名前があれば前回のデータを読み込む
function latestBlockFromRows(rows){
  let lastStart = 0;
  rows.forEach((r, i)=>{ if(r.ts) lastStart = i; });
  return rows.slice(lastStart);
}

async function loadPreviousByName(){
  const name = document.getElementById('empName').value.trim();
  if(!name || !SHEET_WEBAPP_URL) return;
  try{
    const res = await fetch(SHEET_WEBAPP_URL, { method: 'GET' });
    if(!res.ok) return;
    const data = await res.json();
    const person = (data.people || []).find(p => p.name === name);
    if(!person){ return; }
    const block = latestBlockFromRows(person.rows);
    if(!block.length) return;

    document.getElementById('empLine').value = block[0].line || '';
    if(block[0].date) document.getElementById('empDate').value = block[0].date;
    if(block[0].hire){
      document.getElementById('empHireDate').value = block[0].hire;
      updateTenureDisplay();
    }

    Object.keys(state).forEach(k=>{ state[k] = {lv:null, sd:null, remarks:""}; });
    block.forEach(r=>{
      const key = r.group + '|' + r.item;
      if(state[key] !== undefined){
        state[key] = { lv: (r.lv===null||r.lv==="") ? null : Number(r.lv), sd: r.sd || null, remarks: r.remarks || "" };
      }
    });
    render();
    showToast(name + ' さんの前回データを読み込みました');
  }catch(e){
    console.error('前回データ読み込みエラー', e);
  }
}

document.getElementById('empName').addEventListener('blur', loadPreviousByName);

// 初期化
(function init(){
  const today = new Date();
