<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>包装工程 教育チェックシート</title>
<style>
  :root{
    --navy:#1F3864;
    --navy-2:#2E4C82;
    --blue:#2B6CD9;
    --blue-soft:#EAF1FD;
    --bg:#F3F4F7;
    --card:#FFFFFF;
    --amber:#D98E2B;
    --amber-soft:#FBF1E1;
    --green:#2F8F5B;
    --green-soft:#E9F5EE;
    --danger:#C0392B;
    --danger-soft:#FBEAE8;
    --unsaved:#8A6D1D;
    --unsaved-soft:#FBF3DC;
    --text:#1C2430;
    --text-muted:#6B7280;
    --text-faint:#9AA1AE;
    --border:#E1E4EA;
    --radius:14px;
    --radius-sm:9px;
    /* 余白は4の倍数の段階だけを使う(その場しのぎの数値を増やさない) */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
    /* 本文・入力文字は16px前後を基準にする */
    --fs-body:16px; --fs-label:13px; --fs-caption:12px; --fs-h1:18px; --fs-h2:15px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    font-size:var(--fs-body); line-height:1.6;
    -webkit-tap-highlight-color:transparent;}
  .num{font-family:"DejaVu Sans Mono","SF Mono",monospace;}
  :focus-visible{outline:2.5px solid var(--blue); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.001ms !important; animation-duration:.001ms !important;} }

  /* ---- 共通ナビゲーション(4アプリを行き来する) ---- */
  .app-nav{display:flex; gap:2px; background:var(--navy-2); overflow-x:auto;
    -ms-overflow-style:none; scrollbar-width:none;}
  .app-nav::-webkit-scrollbar{display:none;}
  .app-nav a{flex:none; padding:10px var(--sp-4); color:rgba(255,255,255,.72); text-decoration:none;
    font-size:13px; font-weight:600; white-space:nowrap; border-bottom:3px solid transparent;
    min-height:44px; display:flex; align-items:center;}
  .app-nav a.current{color:#fff; border-bottom-color:var(--blue); background:rgba(255,255,255,.06);}

  /* ---- ステータスバナー(未保存/保存中/失敗/成功などを同じ見た目で伝える) ---- */
  .status-banner{display:flex; align-items:flex-start; gap:var(--sp-2); padding:var(--sp-3) var(--sp-4);
    border-radius:var(--radius-sm); font-size:var(--fs-label); font-weight:600; margin-bottom:var(--sp-3);
    border:1.5px solid transparent; line-height:1.5;}
  .status-banner .sb-icon{flex:none; font-size:15px; margin-top:1px;}
  .status-banner .sb-body{flex:1; min-width:0;}
  .status-banner .sb-action{font-weight:700; text-decoration:underline; margin-top:2px; display:inline-block;}
  .status-banner.info{background:var(--blue-soft); border-color:#C7DBFA; color:var(--navy-2);}
  .status-banner.warn{background:var(--amber-soft); border-color:#F0DBAF; color:#7A551A;}
  .status-banner.error{background:var(--danger-soft); border-color:#F0C6C0; color:#8C2E22;}
  .status-banner.success{background:var(--green-soft); border-color:#BFE3CF; color:#1F6B41;}
  .status-banner.unsaved{background:var(--unsaved-soft); border-color:#EEDDA0; color:var(--unsaved);}

  .top-sticky-wrap{position:sticky; top:0; z-index:50;}
  header.top{
    background:var(--navy);color:#fff;position:relative;
    padding:14px 16px 12px;box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .eval-mode-switch{display:flex;gap:8px;}
  .eval-mode-btn{flex:1;padding:12px 8px;border-radius:12px;border:2px solid var(--border);
    background:#FAFBFC;font-size:var(--fs-label);font-weight:700;color:var(--text-muted);cursor:pointer;
    font-family:inherit;min-height:44px;}
  .eval-mode-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .eval-mode-btn.active::before{content:"✓ ";}
  .v-icon-btn{position:absolute;top:8px;width:44px;height:44px;border-radius:9px;
    border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);
    color:#fff;font-size:16px;line-height:1;cursor:pointer;display:flex;
    align-items:center;justify-content:center;}
  .v-icon-btn:active{background:rgba(255,255,255,.25);}
  header.top h1{margin:0;font-size:var(--fs-h1);font-weight:700;letter-spacing:.02em;}
  header.top .sub{font-size:var(--fs-caption);opacity:.85;margin-top:2px;}
  .progress-wrap{display:flex;align-items:center;gap:10px;margin-top:10px; flex-wrap:wrap;}
  .ring{position:relative;width:38px;height:38px;flex:none;}
  .ring svg{transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:4;}
  .ring .bg{stroke:rgba(255,255,255,.25);}
  .ring .fg{stroke:var(--amber);stroke-linecap:round;transition:stroke-dashoffset .3s ease;}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;}
  .progress-text{font-size:var(--fs-caption);opacity:.95;}
  .progress-text b{font-size:14px;}
  .progress-sub{font-size:11px;opacity:.8;margin-top:1px;}

  .v-floating-panel{position:sticky;top:0;z-index:49;max-width:640px;margin:0 auto 10px;
    border-top:none;border-radius:0 0 var(--radius) var(--radius);
    box-shadow:0 6px 14px rgba(0,0,0,.12);}

  main{max-width:640px;margin:0 auto;padding:var(--sp-4) var(--sp-3) 100px;}
  @media (min-width:860px){
    main{max-width:760px; padding:var(--sp-5) var(--sp-4) 100px;}
    .field-row-pc{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4);}
  }

  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    padding:var(--sp-4);margin-bottom:var(--sp-3);}
  .card h2{font-size:var(--fs-h2);margin:0 0 var(--sp-3);color:var(--navy);font-weight:700;}
  .field{margin-bottom:var(--sp-3);}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:var(--fs-label);color:var(--text-muted);margin-bottom:var(--sp-1);font-weight:600;}
  .field input, .field select{
    width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-size:var(--fs-body);background:#FAFBFC;color:var(--text);
    min-height:44px;box-sizing:border-box;-webkit-appearance:none;appearance:none;
  }
  .field input:focus{outline:2.5px solid var(--blue); outline-offset:1px; border-color:var(--blue);}

  .empty-note{font-size:12px;color:var(--text-muted);padding:20px 4px;text-align:center;}
  .setup-note{font-size:12px;color:var(--text-muted);line-height:1.6;}

  /* 工程アコーディオン */
  .group{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    margin-bottom:10px;overflow:hidden;}
  .group-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
    cursor:pointer;user-select:none;}
  .group-hd .name{font-size:14px;font-weight:700;}
  .group-hd .meta{display:flex;align-items:center;gap:8px;}
  .group-hd .count{font-size:11px;color:var(--text-muted);}
  .group-hd .count b{color:var(--navy);}
  .chev{width:9px;height:9px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);
    transform:rotate(45deg);transition:transform .2s ease;margin-right:2px;}
  .group.open > .group-hd .chev{transform:rotate(-135deg);}
  .group-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .group.open > .group-body{max-height:20000px;}

  /* 親スキル */
  .skill{border-top:1px solid var(--border);}
  .skill-hd{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;
    cursor:pointer;background:#FAFBFC;}
  .skill-hd .sname{font-size:13px;font-weight:700;}
  .skill-hd .sprog{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;}
  .skill-hd .sprog b{color:var(--navy);}
  .skill-hd .badge-complete{background:var(--green);color:#fff;font-size:10px;font-weight:700;
    padding:2px 7px;border-radius:6px;}
  .skill.open > .skill-hd .chev{transform:rotate(-135deg);}
  .skill-bar-wrap{height:5px;background:var(--border);}
  .skill-bar{height:100%;background:var(--amber);transition:width .2s ease;}
  .skill.sk-complete .skill-bar{background:var(--green);}

  /* 工程一覧・親スキル一覧（カラフルカード共通） */
  .proc-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media (min-width:560px){ .proc-grid{grid-template-columns:1fr 1fr;} }
  @media (min-width:860px){ .proc-grid{grid-template-columns:1fr 1fr 1fr;} }
  .proc-card{position:relative;border:none;border-radius:18px;padding:18px 18px 16px;
    text-align:left;cursor:pointer;font-family:inherit;min-height:128px;color:#fff;
    background:linear-gradient(135deg, var(--pc-a), var(--pc-b));
    box-shadow:0 6px 16px rgba(0,0,0,.14);overflow:hidden;}
  .proc-card::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;
    border-radius:50%;background:rgba(255,255,255,.10);}
  .proc-card:active{filter:brightness(.94);}
  .proc-card.pc-complete{box-shadow:0 6px 16px rgba(0,0,0,.14), inset 0 0 0 2.5px rgba(255,255,255,.85);}
  .proc-card-sm{min-height:104px;padding:14px 16px;}
  .proc-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative;z-index:1;}
  .proc-icon{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}
  .proc-icon-sm{width:30px;height:30px;font-size:15px;border-radius:9px;}
  .proc-name{font-size:16.5px;font-weight:800;color:#fff;margin-bottom:10px;position:relative;z-index:1;
    text-shadow:0 1px 2px rgba(0,0,0,.15);}
  .proc-bar-wrap{height:8px;background:rgba(255,255,255,.28);border-radius:5px;overflow:hidden;
    margin-bottom:8px;position:relative;z-index:1;}
  .proc-bar{height:100%;background:#fff;border-radius:5px;transition:width .2s ease;}
  .proc-meta{font-size:12.5px;color:rgba(255,255,255,.92);position:relative;z-index:1;}
  .proc-card .badge-complete{background:rgba(255,255,255,.95);color:var(--green);}

  /* 詳細ページ上部のテーマカード（選んだ工程の色を引き継ぐ） */
  .proc-theme-card{background:linear-gradient(135deg, var(--pc-a), var(--pc-b)) !important;
    border:none !important;color:#fff;}
  .proc-theme-card .empty-note, .proc-theme-card label{color:rgba(255,255,255,.85) !important;}
  .proc-theme-hd{display:flex;align-items:center;gap:12px;margin:14px 0 10px;}
  .proc-theme-card .gd-nav-btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:#fff;}
  .proc-theme-card .gd-page{color:rgba(255,255,255,.85);}
  .proc-theme-card .v-search-input{background:rgba(255,255,255,.92);border-color:transparent;}

  /* 詳細ページのナビゲーション */
  .gd-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .gd-nav-btn{flex:none;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;
    background:#FAFBFC;font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer;}
  .gd-nav-btn:disabled{opacity:.35;cursor:default;}
  .gd-page{font-size:12.5px;color:var(--text-muted);font-weight:700;}
  .backbar{display:flex;align-items:center;gap:8px;padding:12px 4px;cursor:pointer;color:var(--navy);
    font-size:14px;font-weight:700;}
  .backbar .arrow{width:9px;height:9px;border-left:2px solid var(--navy);border-bottom:2px solid var(--navy);
    transform:rotate(45deg);}
  .skill-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .skill.open > .skill-body{max-height:20000px;}

  /* 詳細項目 */
  .item{padding:12px 14px;border-top:1px solid var(--border);}
  .item .iname{font-size:13px;font-weight:600;margin-bottom:8px;}
  .lv-row{display:flex;gap:5px;margin-bottom:6px;}
  .lv-btn{
    flex:1;padding:9px 0;border-radius:9px;border:1.5px solid var(--border);
    background:#FAFBFC;font-size:14px;font-weight:700;color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;
    min-height:44px;
  }
  .lv-btn.active{border-width:2.5px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);}
  .lv-btn.active::after{content:"✓"; font-size:11px;}
  .lv-btn[data-lv="0"].active{background:#B0B4BA;border-color:#7D8188;color:#fff;}
  .lv-btn[data-lv="1"].active{background:#CBBE8A;border-color:#9C8F57;color:#fff;}
  .lv-btn[data-lv="2"].active{background:#D9A94E;border-color:#A87B22;color:#fff;}
  .lv-btn[data-lv="3"].active{background:#8FBF6B;border-color:#5C9138;color:#fff;}
  .lv-btn[data-lv="4"].active{background:#2F8F5B;border-color:#1D6B40;color:#fff;}
  .lv-current{font-size:12px;font-weight:700;margin-bottom:8px;}
  .lv-current .lv-current-label{padding:2px 9px;border-radius:7px;color:#fff;}
  .lv-section-label{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:5px;}
  .lv-btn-self{border-style:dashed;}
  .task-status-row{display:flex;gap:6px;margin-bottom:6px;}
  .task-status-btn{flex:1;padding:8px 4px;border-radius:9px;border:1.5px solid var(--border);
    background:#FAFBFC;font-size:11.5px;font-weight:700;color:var(--text-muted);cursor:pointer;
    font-family:inherit;}
  .task-status-btn.active{color:#fff;}
  .task-due-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .task-due-label{font-size:11.5px;font-weight:700;color:var(--text-muted);flex:none;}
  .task-due-input{padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;
    font-size:12.5px;font-family:inherit;color:var(--text);}
  .task-overdue-badge{background:#C0392B;color:#fff;font-size:10px;font-weight:700;
    padding:2px 8px;border-radius:8px;}
  .weak-point-card{margin-bottom:10px;border:1.5px solid #E0A83C;background:#FFF9EE;}
  .weak-point-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 0;border-top:1px solid #F0DFB8;}
  .weak-point-row:first-of-type{border-top:none;}
  .weak-point-name{font-size:13px;font-weight:700;color:var(--text);}
  .weak-point-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .weak-point-add-btn{flex:none;padding:8px 12px;border:none;border-radius:9px;
    background:#1E3A5F;color:#fff;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .weak-point-nomatch{flex:none;font-size:11px;color:var(--text-muted);}
  .item-remarks-toggle{background:none;border:none;color:var(--navy);font-size:11.5px;
    font-weight:700;padding:2px 0;cursor:pointer;}
  .item-remarks-input{width:100%;margin-top:6px;padding:8px 9px;border:1px solid var(--border);
    border-radius:8px;font-size:13px;background:#FAFBFC;color:var(--text);box-sizing:border-box;}

  /* 基本情報の氏名候補 */
  .v-search-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;
    font-size:15px;background:#FAFBFC;color:var(--text);box-sizing:border-box;height:42px;}

  .v-admin-card{margin-top:14px;}
  .v-admin-link{width:100%;background:none;border:none;padding:4px 0;font-size:12.5px;
    color:var(--text-muted);text-align:left;cursor:pointer;}
  .v-admin-section-title{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px;
    padding-top:10px;border-top:1px solid var(--border);}
  .v-admin-add-btn{width:100%;padding:10px 0;border:none;border-radius:10px;background:var(--navy);
    color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:4px;}
  .v-admin-add-btn:active{background:var(--navy-2);}
  .v-admin-del-btn{width:100%;padding:10px 0;border:1.5px solid #C0392B;border-radius:10px;
    background:#fff;color:#C0392B;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:4px;}
  .v-admin-del-btn:active{background:#FBEAE8;}
  .v-admin-msg{font-size:12px;margin-top:8px;min-height:16px;}
  .v-admin-msg.ok{color:var(--green);}
  .v-admin-msg.err{color:#C0392B;}
  .v-admin-item-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 0;border-top:1px solid var(--border);font-size:12.5px;}
  .v-admin-item-row:first-of-type{border-top:none;}
  .v-admin-reorder-btns{display:flex;gap:4px;flex:none;}
  .v-admin-reorder-btns button{width:26px;height:26px;border:1px solid var(--border);border-radius:6px;
    background:#FAFBFC;cursor:pointer;font-size:11px;}

  .save-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(180deg,rgba(243,244,247,0),var(--bg) 30%);
    padding:14px 12px 16px;display:flex;justify-content:center;}
  .save-btn{max-width:496px;width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(31,56,100,.35);cursor:pointer;}
  .save-btn:active{background:var(--navy-2);}
  .save-btn:disabled{opacity:.6;}
  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(8px);
    background:var(--text);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
    opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;z-index:60;
    max-width:88vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (min-width: 860px){
    main{max-width:900px;}
    .card{max-width:900px;margin-left:auto;margin-right:auto;}
    .group{max-width:900px;margin-left:auto;margin-right:auto;}
    .save-bar{display:flex;justify-content:center;}
    .save-btn{max-width:900px;}
  }
</style>
</head>
<body>

<div class="top-sticky-wrap">
<nav class="app-nav" aria-label="アプリ内ナビゲーション">
  <a href="index.html">✏️ スキル入力</a>
  <a href="education.html" class="current" aria-current="page">🎓 教育記録</a>
  <a href="viewer2.html">📋 閲覧・集計</a>
  <a href="task-manager.html">🗂️ タスク管理</a>
</nav>
<header class="top">
  <button id="adminToggleBtn" class="v-icon-btn" style="right:10px;" aria-label="管理者メニューを開く" title="管理者メニュー">🔧</button>
  <h1>包装工程 教育チェックシート</h1>
  <div class="sub" id="headerSub">対象者を選んで教育状況を記録します</div>
  <div class="progress-wrap">
    <div class="ring">
      <svg width="38" height="38" viewBox="0 0 38 38">
        <circle class="bg" cx="19" cy="19" r="16"></circle>
        <circle class="fg" id="ringFg" cx="19" cy="19" r="16" stroke-dasharray="100.5" stroke-dashoffset="100.5"></circle>
      </svg>
      <div class="pct num" id="ringPct">0%</div>
    </div>
    <div>
      <div class="progress-text">入力済み <b class="num" id="doneCount">0</b> / <span class="num" id="totalCount">0</span> 項目</div>
      <div class="progress-sub" id="achieveSub">習得可能(Lv3以上): <b class="num" id="achieveCount">0</b>件</div>
    </div>
  </div>
</header>
</div>
<div id="topStatusBannerWrap" style="max-width:640px;margin:0 auto;padding:10px 12px 0;">
  <div id="topStatusBanner"></div>
</div>

<div id="adminPanel" class="card v-floating-panel" style="display:none;">
  <div class="v-admin-section-title" style="border-top:none;padding-top:0;">🔧 管理者: 教育項目を編集</div>

  <div class="v-admin-section-title">項目を追加する</div>
  <div class="field">
    <label for="adminGroupInput">工程名（既存の工程名を選ぶか、新しい名前を入力）</label>
    <input id="adminGroupInput" type="text" placeholder="例: STP工程" list="adminGroupList">
    <datalist id="adminGroupList"></datalist>
  </div>
  <div class="field">
    <label for="adminSkillInput">親スキル項目名（工程名を選ぶと候補が出ます）</label>
    <input id="adminSkillInput" type="text" placeholder="例: STP2" list="adminAddSkillList">
    <datalist id="adminAddSkillList"></datalist>
  </div>
  <div class="field">

<script>
// ↓ Apps ScriptのウェブアプリURL(index.html / viewer2.htmlと同じもの)
const DEFAULT_SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbz-TjWClvojimS6R_FVVpKEufzKo6kUFtNVw-YFXSQhSWL0nkhx3StKRxsrEty5k2wm/exec";
const WEBAPP_URL_KEY = 'skillcheck_webapp_url'; // index.html/viewer2.htmlと同じキーを共有
let SHEET_WEBAPP_URL = (function(){
  try{
    const saved = localStorage.getItem(WEBAPP_URL_KEY);
    return saved || DEFAULT_SHEET_WEBAPP_URL;
  }catch(e){ return DEFAULT_SHEET_WEBAPP_URL; }
})();

const LV_LABELS = ["未教育","説明済み","補助あり","一人で可能","指導可能"];
const LV_COLORS = ["#B0B4BA","#CBBE8A","#D9A94E","#8FBF6B","#2F8F5B"];
const ADMIN_PASSWORD = "1222";

let EDU_GROUPS = [];   // [{name, skills:[{name, items:[itemName,...]}]}]
let SKC_GROUPS = [];   // スキルチェック側の工程・スキル項目 [{name, items:[itemName,...]}]（管理者パネルの入力候補として使う）
let EDU_STATE = {};    // key "group|||skill|||item" -> {lv:null, selfLv:null, taskStatus:"not_started", startDate:"", dueDate:"", remarks:"", dirty:false}
let ROSTER = [];
let currentGroupName = null; // null = 工程一覧ページ
let currentSkillName = null; // null = 親スキル一覧ページ、値あり = 項目詳細ページ
let evalMode = 'trainer'; // 'trainer' = 教育担当者評価を入力中、'self' = 本人の自己評価を入力中
let openSkills = new Set(); // （互換のため残すが、3階層化により基本未使用）
let adminUnlocked = false;

function evalField(){ return evalMode === 'trainer' ? 'lv' : 'selfLv'; }
function evalLabel(){ return evalMode === 'trainer' ? '🧑\u200d🏫 教育担当者評価' : '🙋 本人の自己評価'; }
// 「完了」の意味はモードによって違う：担当者評価はLv3以上で認定可能、自己評価は回答済みかどうか
function isItemDone(st){
  if(!st) return false;
  const v = st[evalField()];
  return evalMode === 'trainer' ? (v !== null && v >= 3) : (v !== null);
}

// 工程名から、見た目の色とアイコンを自動で決める（同じ名前なら毎回同じ色・アイコンになる）
const PROC_COLORS = [
  {a:'#2E5C8A', b:'#5B87BE'}, {a:'#2E8A6B', b:'#54B096'}, {a:'#8A6B2E', b:'#C0993F'},
  {a:'#8A2E6B', b:'#C154A0'}, {a:'#5C2E8A', b:'#9159C4'}, {a:'#2E748A', b:'#57A6C4'},
  {a:'#8A3E2E', b:'#C0633F'}, {a:'#3E8A2E', b:'#68C154'}, {a:'#8A2E3E', b:'#C1546B'},
  {a:'#6B5C2E', b:'#A38F4A'},
];
const PROC_ICONS = ['⚙️','🔧','📦','🔍','🧴','🧹','🏁','🚨','🛠️','📋','⚡','🧪','🔩','📐','🎯','🧯','🧰','🚿'];
function hashStr(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return Math.abs(h); }
function colorForProc(name){ return PROC_COLORS[hashStr(name) % PROC_COLORS.length]; }
function iconForProc(name){ return PROC_ICONS[hashStr(name) % PROC_ICONS.length]; }

function stateKey(g,s,it){ return g+'|||'+s+'|||'+it; }

// 日本時間の「今日」を YYYY-MM-DD 形式で返す。
// new Date().toISOString().slice(0,10) はUTCに変換されるため、日本時間の深夜0時〜8時59分には
// 実際より1日前の日付になってしまう不具合があった。現地の年月日から直接組み立てることでこれを避ける。
function todayStrJST(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function rebuildStateFromGroups(preserve){
  const newState = {};
  EDU_GROUPS.forEach(g=>{
    g.skills.forEach(s=>{
      s.items.forEach(it=>{
        const key = stateKey(g.name, s.name, it);
        newState[key] = (preserve && EDU_STATE[key]) ? EDU_STATE[key] : { lv:null, selfLv:null, remarks:"", dirty:false };
      });
    });
  });
  EDU_STATE = newState;
}

function showToast(msg, duration){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>t.classList.remove('show'), duration || 3200);
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(str){
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ---------------------------------------------------------------------------
// 描画
// ---------------------------------------------------------------------------
function groupProgress(g){
  const allItems = [];
  g.skills.forEach(s=>s.items.forEach(it=>allItems.push(stateKey(g.name,s.name,it))));
  const done = allItems.filter(k=>isItemDone(EDU_STATE[k])).length;
  const total = allItems.length;
  const pct = total ? Math.round(done/total*100) : 0;
  return { done, total, pct };
}

function render(){
  const area = document.getElementById('groupsArea');
  if(!EDU_GROUPS.length){
    area.innerHTML = `<div class="card"><div class="empty-note">教育項目がまだ登録されていません。右上の🔧から管理者パスワードを入力して、工程・親スキル・詳細項目を追加してください。</div></div>`;
    updateProgress();
    return;
  }

  const groupValid = currentGroupName !== null && EDU_GROUPS.some(g=>g.name===currentGroupName);
  if(!groupValid){
    currentGroupName = null;
    currentSkillName = null;
    renderGroupListPage(area);
  } else {
    const g = EDU_GROUPS.find(g=>g.name===currentGroupName);
    const skillValid = currentSkillName !== null && g.skills.some(s=>s.name===currentSkillName);
    if(!skillValid){
      currentSkillName = null;
      renderSkillListPage(area, currentGroupName);
    } else {
      renderItemDetailPage(area, currentGroupName, currentSkillName);
    }
  }

  updateProgress();
}

// 弱点(工程+項目名)に一致する「親スキル」を教育設定の中から探す(同じ命名規則を使っている前提)
function findMatchingSkill(group, itemName){
  const g = EDU_GROUPS.find(g0=>g0.name===group);
  if(!g) return null;
  const s = g.skills.find(s0=>s0.name===itemName);
  return s ? { group: g, skill: s } : null;
}

function weakPointsBannerHtml(){
  if(!WEAK_POINTS.length) return '';
  const rowsHtml = WEAK_POINTS.map((wp,i)=>{
    const match = findMatchingSkill(wp.group, wp.item);
    const lvLabel = ['未経験・未着手','微妙（一人でできるか怪しい）'][wp.lv] || ('Lv'+wp.lv);
    return `
      <div class="weak-point-row">
        <div class="weak-point-main">
          <div class="weak-point-name">${escapeHtml(wp.group)} ／ ${escapeHtml(wp.item)}</div>
          <div class="weak-point-sub">スキルチェック: ${escapeHtml(lvLabel)}</div>
        </div>
        ${match
          ? `<button class="weak-point-add-btn" data-wpgroup="${escapeAttr(match.group.name)}" data-wpskill="${escapeAttr(match.skill.name)}">＋教育タスクに追加</button>`
          : `<span class="weak-point-nomatch">未登録の項目</span>`}
      </div>`;
  }).join('');
  return `
    <div class="card weak-point-card">
      <h2 style="margin:0 0 4px;">🎯 スキルチェックの弱点（${WEAK_POINTS.length}件）</h2>
      <div class="empty-note" style="margin-bottom:8px;">スキルチェックでLvが低かった項目です。教育タスクとして取り込めます。</div>
      ${rowsHtml}
    </div>`;
}

// ---- ページ1: 工程一覧（カラフル・アイコン付き） ---------------------------
function renderGroupListPage(area){
  const cardsHtml = EDU_GROUPS.map(g=>{
    const { done, total, pct } = groupProgress(g);
    const complete = total>0 && done===total;
    const c = colorForProc(g.name);
    const icon = iconForProc(g.name);
    return `
      <button class="proc-card ${complete?'pc-complete':''}" data-opengroup="${escapeAttr(g.name)}"
        style="--pc-a:${c.a};--pc-b:${c.b};">
        <div class="proc-card-top">
          <div class="proc-icon">${icon}</div>
          ${complete ? '<span class="badge-complete">完了</span>' : ''}
        </div>
        <div class="proc-name">${escapeHtml(g.name)}</div>
        <div class="proc-bar-wrap"><div class="proc-bar" style="width:${pct}%;"></div></div>
        <div class="proc-meta"><b class="num">${done}</b><span class="num">/${total}</span>項目完了　<b class="num">${pct}%</b></div>
      </button>`;
  }).join('');

  area.innerHTML = `
    ${evalMode==='trainer' ? weakPointsBannerHtml() : ''}
    <div class="card" style="margin-bottom:10px;">
      <div class="v-admin-section-title" style="border-top:none;padding-top:0;">工程を選んでください</div>
      <div class="empty-note" style="margin-top:-4px;">工程をタップすると、その工程の親スキル一覧に移動します</div>
    </div>
    <div class="proc-grid">${cardsHtml}</div>`;

  area.querySelectorAll('.weak-point-add-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const gname = btn.dataset.wpgroup, sname = btn.dataset.wpskill;
      const g = EDU_GROUPS.find(g0=>g0.name===gname);
      const s = g.skills.find(s0=>s0.name===sname);
      s.items.forEach(it=>{
        const key = stateKey(gname, sname, it);
        if(!EDU_STATE[key]) EDU_STATE[key] = {lv:null, selfLv:null, taskStatus:"not_started", startDate:"", dueDate:"", remarks:"", dirty:false};
        EDU_STATE[key].taskStatus = 'in_progress';
        EDU_STATE[key].dirty = true;
      });
      showToast(`「${sname}」を教育タスク(進行中)に追加しました`);
      saveDraftToLocal();
      currentGroupName = gname;
      currentSkillName = sname;
      render();
    });
  });

  area.querySelectorAll('[data-opengroup]').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentGroupName = el.dataset.opengroup;
      currentSkillName = null;
      render();
    });
  });
}

// ---- ページ2: 親スキル一覧（選んだ工程の色テーマを引き継ぐ） -----------------
function renderSkillListPage(area, gname){
  const idx = EDU_GROUPS.findIndex(g=>g.name===gname);
  const g = EDU_GROUPS[idx];
  const { done, total, pct } = groupProgress(g);
  const c = colorForProc(g.name);
  const icon = iconForProc(g.name);

  const cardsHtml = g.skills.map(s=>{
    const keys = s.items.map(it=>stateKey(g.name,s.name,it));
    const sdone = keys.filter(k=>isItemDone(EDU_STATE[k])).length;
    const stotal = keys.length;
    const spct = stotal ? Math.round(sdone/stotal*100) : 0;
    const complete = stotal>0 && sdone===stotal;
    return `
      <button class="proc-card proc-card-sm ${complete?'pc-complete':''}" data-openskill="${escapeAttr(s.name)}"
        style="--pc-a:${c.a};--pc-b:${c.b};">
        <div class="proc-card-top">
          <div class="proc-icon proc-icon-sm">📄</div>
          ${complete ? `<span class="badge-complete">${evalMode==='trainer'?'認定可能':'自己評価済み'}</span>` : ''}
        </div>
        <div class="proc-name" style="font-size:14.5px;">${escapeHtml(s.name)}</div>
        <div class="proc-bar-wrap"><div class="proc-bar" style="width:${spct}%;"></div></div>
        <div class="proc-meta"><b class="num">${sdone}</b><span class="num">/${stotal}</span>項目　<b class="num">${spct}%</b></div>
      </button>`;
  }).join('');

  const jumpOptions = EDU_GROUPS.map((gg,i)=>`<option value="${escapeAttr(gg.name)}" ${gg.name===gname?'selected':''}>${i+1}. ${escapeHtml(gg.name)}</option>`).join('');

  area.innerHTML = `
    <div class="backbar" data-backtolist>
      <div class="arrow"></div><span>工程一覧へ戻る</span>
    </div>
    <div class="card proc-theme-card" style="margin-bottom:10px;--pc-a:${c.a};--pc-b:${c.b};">
      <div class="gd-nav">
        <button class="gd-nav-btn" id="prevGroupBtn" ${idx<=0?'disabled':''}>← 前の工程</button>
        <div class="gd-page">${idx+1} / ${EDU_GROUPS.length}ページ</div>
        <button class="gd-nav-btn" id="nextGroupBtn" ${idx>=EDU_GROUPS.length-1?'disabled':''}>次の工程 →</button>
      </div>
      <select id="jumpGroupSelect" class="v-search-input" style="margin-top:8px;">${jumpOptions}</select>
      <div class="proc-theme-hd">
        <div class="proc-icon">${icon}</div>
        <div>
          <div class="proc-name" style="font-size:17px;">${escapeHtml(g.name)}</div>
          <div class="proc-meta"><b class="num">${done}</b><span class="num">/${total}</span>項目完了　<b class="num">${pct}%</b></div>
        </div>
      </div>
      <div class="proc-bar-wrap"><div class="proc-bar" style="width:${pct}%;"></div></div>
    </div>
    <div class="empty-note" style="margin-bottom:8px;">親スキルを選んでください</div>
    <div class="proc-grid">${cardsHtml}</div>`;

  area.querySelectorAll('[data-backtolist]').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentGroupName = null;
      render();
    });
  });
  const prevBtn = document.getElementById('prevGroupBtn');
  const nextBtn = document.getElementById('nextGroupBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(idx>0){ currentGroupName = EDU_GROUPS[idx-1].name; render(); } });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(idx<EDU_GROUPS.length-1){ currentGroupName = EDU_GROUPS[idx+1].name; render(); } });
  const jumpSelect = document.getElementById('jumpGroupSelect');
  if(jumpSelect) jumpSelect.addEventListener('change', ()=>{ currentGroupName = jumpSelect.value; render(); });

  area.querySelectorAll('[data-openskill]').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentSkillName = el.dataset.openskill;
      render();
    });
  });
}

// ---- ページ3: 項目詳細（Lv入力） -------------------------------------------
function renderItemDetailPage(area, gname, sname){
  const gidx = EDU_GROUPS.findIndex(g=>g.name===gname);
  const g = EDU_GROUPS[gidx];
  const sidx = g.skills.findIndex(s=>s.name===sname);
  const s = g.skills[sidx];
  const c = colorForProc(g.name);
  const icon = iconForProc(g.name);

  const keys = s.items.map(it=>stateKey(g.name,s.name,it));
  const sdone = keys.filter(k=>isItemDone(EDU_STATE[k])).length;
  const stotal = keys.length;
  const spct = stotal ? Math.round(sdone/stotal*100) : 0;
  const field = evalField();

  const TASK_STATUS_LABELS = { not_started: '未着手', in_progress: '進行中', done: '完了' };
  const TASK_STATUS_COLORS = { not_started: '#B0B4BA', in_progress: '#E0A83C', done: '#2F8F5B' };

  const itemsHtml = s.items.map(it=>{
    const key = stateKey(g.name,s.name,it);
    const st = EDU_STATE[key] || {lv:null, selfLv:null, taskStatus:"not_started", startDate:"", dueDate:"", remarks:"", dirty:false};
    const val = st[field];
    const lvBtns = [0,1,2,3,4].map(n=>`<div class="lv-btn ${evalMode==='self'?'lv-btn-self':''} ${val===n?'active':''} num" data-key="${escapeAttr(key)}" data-field="${field}" data-lv="${n}">${n}</div>`).join('');
    const curLabel = val===null ? '未選択' : LV_LABELS[val];
    const curColor = val===null ? '#B0B4BA' : LV_COLORS[val];
    const remarksVisible = st.remarks && st.remarks.length>0;
    const taskStatus = st.taskStatus || 'not_started';
    const startDate = st.startDate || '';
    const dueDate = st.dueDate || '';
    const todayStr = todayStrJST();
    const isOverdue = dueDate && dueDate < todayStr && taskStatus !== 'done';
    const taskStatusHtml = evalMode === 'trainer' ? `
        <div class="lv-section-label" style="margin-top:10px;">📋 タスク状態</div>
        <div class="task-status-row">
          ${['not_started','in_progress','done'].map(ts=>`<button class="task-status-btn ${ts===taskStatus?'active':''}" data-key="${escapeAttr(key)}" data-taskstatus="${ts}" style="${ts===taskStatus?`background:${TASK_STATUS_COLORS[ts]};border-color:${TASK_STATUS_COLORS[ts]};`:''}">${TASK_STATUS_LABELS[ts]}</button>`).join('')}
        </div>
        <div class="task-due-row">
          <span class="task-due-label">開始</span>
          <input type="date" class="task-start-input" data-key="${escapeAttr(key)}" value="${escapeAttr(startDate)}">
          <span class="task-due-label">〜期限</span>
          <input type="date" class="task-due-input" data-key="${escapeAttr(key)}" value="${escapeAttr(dueDate)}">
          ${isOverdue ? '<span class="task-overdue-badge">期限超過</span>' : ''}
        </div>` : '';
    return `
      <div class="item">
        <div class="iname">${escapeHtml(it)}</div>
        <div class="lv-section-label">${evalLabel()}</div>
        <div class="lv-row">${lvBtns}</div>
        <div class="lv-current"><span class="lv-current-label" style="background:${curColor};">${curLabel}</span></div>
        ${taskStatusHtml}
        <button class="item-remarks-toggle" data-key="${escapeAttr(key)}">💬 コメント・注意事項${remarksVisible ? '（入力あり）' : ''}</button>
        <input type="text" class="item-remarks-input" data-key="${escapeAttr(key)}" placeholder="コメント・注意事項(任意)"
          value="${escapeAttr(st.remarks||'')}" style="display:${remarksVisible?'block':'none'};">
      </div>`;
  }).join('');

  const skillJumpOptions = g.skills.map((ss,i)=>`<option value="${escapeAttr(ss.name)}" ${ss.name===sname?'selected':''}>${i+1}. ${escapeHtml(ss.name)}</option>`).join('');

  area.innerHTML = `
    <div class="backbar" data-backtoskills>
      <div class="arrow"></div><span>${escapeHtml(g.name)}の親スキル一覧へ戻る</span>
    </div>
    <div class="card proc-theme-card" style="margin-bottom:10px;--pc-a:${c.a};--pc-b:${c.b};">
      <div class="gd-nav">
        <button class="gd-nav-btn" id="prevSkillBtn" ${sidx<=0?'disabled':''}>← 前のスキル</button>
        <div class="gd-page">${sidx+1} / ${g.skills.length}ページ</div>
        <button class="gd-nav-btn" id="nextSkillBtn" ${sidx>=g.skills.length-1?'disabled':''}>次のスキル →</button>
      </div>
      <select id="jumpSkillSelect" class="v-search-input" style="margin-top:8px;">${skillJumpOptions}</select>
      <div class="proc-theme-hd">
        <div class="proc-icon proc-icon-sm">${icon}</div>
        <div>
          <div style="font-size:11px;color:rgba(255,255,255,.75);">${escapeHtml(g.name)} ・ ${evalLabel()}</div>
          <div class="proc-name" style="font-size:16px;">${escapeHtml(s.name)}</div>
        </div>
      </div>
      <div class="proc-bar-wrap"><div class="proc-bar" style="width:${spct}%;"></div></div>
      <div class="proc-meta"><b class="num">${sdone}</b><span class="num">/${stotal}</span>項目完了　<b class="num">${spct}%</b></div>
    </div>
    ${itemsHtml}
    <div class="backbar" data-backtoskills style="margin-top:10px;">
      <div class="arrow"></div><span>${escapeHtml(g.name)}の親スキル一覧へ戻る</span>
    </div>`;

  area.querySelectorAll('[data-backtoskills]').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentSkillName = null;
      render();
    });
  });
  const prevBtn = document.getElementById('prevSkillBtn');
  const nextBtn = document.getElementById('nextSkillBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(sidx>0){ currentSkillName = g.skills[sidx-1].name; render(); } });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(sidx<g.skills.length-1){ currentSkillName = g.skills[sidx+1].name; render(); } });
  const jumpSelect = document.getElementById('jumpSkillSelect');
  if(jumpSelect) jumpSelect.addEventListener('change', ()=>{ currentSkillName = jumpSelect.value; render(); });

  wireItemEvents();
}

function wireItemEvents(){
  const area = document.getElementById('groupsArea');
  area.querySelectorAll('.lv-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = btn.dataset.key, lv = parseInt(btn.dataset.lv,10);
      const field = btn.dataset.field || 'lv'; // 'lv'=教育担当者評価、'selfLv'=本人の自己評価
      if(!EDU_STATE[key]) EDU_STATE[key] = {lv:null, selfLv:null, taskStatus:"not_started", startDate:"", dueDate:"", remarks:"", dirty:false};
      EDU_STATE[key][field] = (EDU_STATE[key][field] === lv) ? null : lv;
      EDU_STATE[key].dirty = true;
      renderItemDetailPage(area, currentGroupName, currentSkillName);
      updateProgress();
      saveDraftToLocal();
    });
  });
  area.querySelectorAll('.item-remarks-toggle').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = btn.dataset.key;
      const input = area.querySelector(`.item-remarks-input[data-key="${CSS.escape(key)}"]`);
      if(input) input.style.display = input.style.display==='none' ? 'block' : 'none';
    });
  });
  area.querySelectorAll('.item-remarks-input').forEach(inp=>{
    inp.addEventListener('click', e=>e.stopPropagation());
    inp.addEventListener('input', ()=>{
      const key = inp.dataset.key;
      if(!EDU_STATE[key]) EDU_STATE[key] = {lv:null, selfLv:null, taskStatus:"not_started", startDate:"", dueDate:"", remarks:"", dirty:false};
      EDU_STATE[key].remarks = inp.value;
      EDU_STATE[key].dirty = true;
      saveDraftToLocal();
    });
  });
  area.querySelectorAll('.task-status-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = btn.dataset.key;
      const ts = btn.dataset.taskstatus;
      if(!EDU_STATE[key]) EDU_STATE[key] = {lv:null, selfLv:null, taskStatus:"not_started", startDate:"", dueDate:"", remarks:"", dirty:false};
      EDU_STATE[key].taskStatus = ts;
      EDU_STATE[key].dirty = true;
      renderItemDetailPage(area, currentGroupName, currentSkillName);
      saveDraftToLocal();
    });
  });
  area.querySelectorAll('.task-due-input').forEach(inp=>{
    inp.addEventListener('click', e=>e.stopPropagation());
    inp.addEventListener('change', ()=>{
      const key = inp.dataset.key;
      if(!EDU_STATE[key]) EDU_STATE[key] = {lv:null, selfLv:null, taskStatus:"not_started", startDate:"", dueDate:"", remarks:"", dirty:false};
      EDU_STATE[key].dueDate = inp.value;
      EDU_STATE[key].dirty = true;
      renderItemDetailPage(area, currentGroupName, currentSkillName);
      saveDraftToLocal();
    });
  });
  area.querySelectorAll('.task-start-input').forEach(inp=>{
    inp.addEventListener('click', e=>e.stopPropagation());
    inp.addEventListener('change', ()=>{
      const key = inp.dataset.key;
      if(!EDU_STATE[key]) EDU_STATE[key] = {lv:null, selfLv:null, taskStatus:"not_started", startDate:"", dueDate:"", remarks:"", dirty:false};
      EDU_STATE[key].startDate = inp.value;
      EDU_STATE[key].dirty = true;
      saveDraftToLocal();
    });
  });
}

function updateProgress(){
  const all = Object.values(EDU_STATE);
  const total = all.length;
  const field = evalField();
  const filled = all.filter(s=>s && s[field] !== null && s[field] !== undefined).length;
  const achieved = all.filter(s=>s && s[field] !== null && s[field] !== undefined && s[field] >= 3).length;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('doneCount').textContent = filled;
  const achieveSub = document.getElementById('achieveSub');
  if(evalMode === 'trainer'){
    achieveSub.style.display = '';
    document.getElementById('achieveCount').textContent = achieved;
  } else {
    achieveSub.style.display = 'none'; // 自己評価では「習得可能」の概念は使わない
  }
  const pct = total ? Math.round(filled/total*100) : 0;
  document.getElementById('ringPct').textContent = pct+'%';
  const circ = 100.5;
  document.getElementById('ringFg').style.strokeDashoffset = circ - (circ*pct/100);
  const target = document.getElementById('targetInput').value.trim();
  const line = document.getElementById('lineInput') ? document.getElementById('lineInput').value.trim() : '';
  document.getElementById('headerSub').textContent = target
    ? `${target} さん${line ? '（'+line+'）' : ''} の教育状況を記録中`
    : '対象者を選んで教育状況を記録します';
}

// 対象者を選んだら、その人の過去の教育状態を読み込む
let currentTargetName = '';   // 今EDU_STATEに読み込まれている対象者(切り替え判定・保存時の整合性チェックに使う)
let loadRequestSeq = 0;        // 対象者読み込みリクエストの通し番号(古い応答が後から届いても無視するため)
let EDU_LOADING = false;       // 対象者データの読み込み中は保存を禁止するためのフラグ

async function loadEduDataForTarget(){
  const name = document.getElementById('targetInput').value.trim();
  if(!name) return;
  if(name === currentTargetName) return; // 同じ人のまま(単にフォーカスが外れただけ)なら、編集中の内容を消さない

  // 未保存の変更があれば、保存せずに切り替えていいか確認する
  const hasDirty = Object.values(EDU_STATE).some(st=>st.dirty);
  if(hasDirty){
    const ok = confirm(`「${currentTargetName || '現在の対象者'}」さんの未保存の変更があります。保存せずに「${name}」さんに切り替えますか？`);
    if(!ok){
      document.getElementById('targetInput').value = currentTargetName;
      return;
    }
  }

  // 前の人の値が一瞬でも残らないよう、まず全項目を空の状態にリセットしてから読み込みに入る
  rebuildStateFromGroups(false);
  render();
  saveDraftToLocal();

  const mySeq = ++loadRequestSeq;
  EDU_LOADING = true;
  updateSaveAvailability();

  if(!SHEET_WEBAPP_URL){
    currentTargetName = name;
    EDU_LOADING = false;
    updateSaveAvailability();
    loadWeakPoints(name);
    return;
  }

  try{
    const res = await fetch(SHEET_WEBAPP_URL + '?action=eduData&name=' + encodeURIComponent(name), { method:'GET' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();

    // 通信中に、さらに別の対象者へ切り替えられていた場合は、この古い応答は使わない
    if(mySeq !== loadRequestSeq) return;
    // 通信中に入力欄が書き換えられていた場合も同様に無視する(念のための二重チェック)
    if(document.getElementById('targetInput').value.trim() !== name) return;

    if(data.line) document.getElementById('lineInput').value = data.line;
    const current = data.current || {};
    Object.keys(current).forEach(key=>{
      const c = current[key];
      if(EDU_STATE[key] !== undefined){
        EDU_STATE[key] = {
          lv: (c.lv===null||c.lv===undefined||c.lv==="") ? null : Number(c.lv),
          selfLv: (c.selfLv===null||c.selfLv===undefined||c.selfLv==="") ? null : Number(c.selfLv),
          taskStatus: c.taskStatus || 'not_started',
          startDate: c.startDate || '',
          dueDate: c.dueDate || '',
          remarks: c.remarks||"", dirty:false
        };
      }
    });
    currentTargetName = name;
    render();
    saveDraftToLocal();
    if(Object.keys(current).length){
      showToast(name + ' さんの前回の教育状況を読み込みました');
    }
  }catch(e){
    console.error('教育データの読み込みエラー', e);
    if(mySeq === loadRequestSeq){
      showToast('⚠️ 前回データの読み込みに失敗しました。手入力で進めることもできます', 5000);
      currentTargetName = name; // 読み込めなくても、以後はこの人として扱う(空の状態から入力できるように)
    }
  }finally{
    if(mySeq === loadRequestSeq){
      EDU_LOADING = false;
      updateSaveAvailability();
    }
  }
  loadWeakPoints(name);
}

// 読み込み中は保存できないようにボタンの状態を切り替える
function updateSaveAvailability(){
  const btn = document.getElementById('saveBtn');
  if(!btn) return;
  if(EDU_LOADING){
    btn.dataset.wasDisabled = btn.disabled ? '1' : '0';
    btn.disabled = true;
    btn.textContent = '読み込み中...';
  } else if(btn.dataset.wasDisabled !== undefined){
    btn.disabled = false;
    btn.textContent = '保存する';
    delete btn.dataset.wasDisabled;
  }
}

const DRAFT_KEY = 'education_draft_v1';

function saveDraftToLocal(){
  try{
    const draft = {
      target: document.getElementById('targetInput').value,
      line: document.getElementById('lineInput').value,
      date: document.getElementById('dateInput').value,
      trainer: document.getElementById('trainerInput').value,
      state: EDU_STATE,
    };
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  }catch(e){}
}

function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
}

function tryRestoreDraft(){
  try{
    const raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    const draft = JSON.parse(raw);
    const hasEntry = draft.target || (draft.state && Object.values(draft.state).some(s=>s.lv!==null || s.remarks));
    if(!hasEntry){ clearDraft(); return; }
    if(!confirm(`前回、途中まで入力していた教育記録があります。復元しますか？\n（対象者: ${draft.target || '(未入力)'}）`)){
      clearDraft();
      return;
    }
    document.getElementById('targetInput').value = draft.target || '';
    document.getElementById('lineInput').value = draft.line || '';
    if(draft.date) document.getElementById('dateInput').value = draft.date;
    document.getElementById('trainerInput').value = draft.trainer || '';
    if(draft.state){
      Object.keys(EDU_STATE).forEach(k=>{
        if(draft.state[k]) EDU_STATE[k] = draft.state[k];
      });
    }
    render();
    showToast('下書きを復元しました');
  }catch(e){
    console.error('下書き復元エラー', e);
  }
}

// 保存
// ---------------------------------------------------------------------------
let SAVING = false; // 保存中の二重送信防止

async function saveEducation(){
  if(SAVING){ showToast('保存処理が進行中です。しばらくお待ちください'); return; }
  if(EDU_LOADING){ showToast('対象者データを読み込み中です。読み込み完了後にもう一度お試しください'); return; }

  const target = document.getElementById('targetInput').value.trim();
  if(!target){ showToast('対象者を入力してください'); return; }

  // 送信するスナップショットを取る(値まで含めて記録し、保存後に「送信時から変わっていないか」を判定できるようにする)
  const changedSnapshots = [];
  const changed = [];
  EDU_GROUPS.forEach(g=>{
    g.skills.forEach(s=>{
      s.items.forEach(it=>{
        const key = stateKey(g.name,s.name,it);
        const st = EDU_STATE[key];
        if(st && st.dirty){
          const itemPayload = { group:g.name, skill:s.name, item:it, lv:st.lv, selfLv:st.selfLv, taskStatus:st.taskStatus||'not_started', startDate:st.startDate||'', dueDate:st.dueDate||'', remarks:st.remarks||"" };
          changed.push(itemPayload);
          changedSnapshots.push({ key, lv:st.lv, selfLv:st.selfLv, taskStatus:st.taskStatus, startDate:st.startDate, dueDate:st.dueDate, remarks:st.remarks });
        }
      });
    });
  });

  if(!changed.length){ showToast('変更された項目がありません'); return; }

  const payload = {
    action: 'saveEducation',
    target,
    line: document.getElementById('lineInput').value.trim(),
    date: document.getElementById('dateInput').value,
    trainer: document.getElementById('trainerInput').value.trim(),
    items: changed,
  };
  const savingForName = target; // この保存が「誰のためのものか」を覚えておく

  const btn = document.getElementById('saveBtn');
  const originalLabel = btn.textContent;
  SAVING = true;
  btn.disabled = true;
  btn.textContent = '保存中...';
  try{
    const res = await fetch(SHEET_WEBAPP_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    let data;
    try{ data = JSON.parse(text); }catch(parseErr){ throw new Error('応答をJSONとして解釈できませんでした'); }

    if(data.status === 'ok'){
      showToast(`保存しました（${changed.length}項目）`);
      // 通信中に対象者が切り替わっていたら、今表示中のEDU_STATEは既に別人のものなので触らない
      if(currentTargetName === savingForName){
        // 送信した項目のうち、「送信時の値のまま変わっていない」ものだけをdirty解除する。
        // 送信中にさらに編集されて値が変わっている項目は、そのままdirty(未送信)として残す。
        changedSnapshots.forEach(snap=>{
          const st = EDU_STATE[snap.key];
          if(!st) return;
          const unchanged = st.lv===snap.lv && st.selfLv===snap.selfLv && st.taskStatus===snap.taskStatus
            && st.startDate===snap.startDate && st.dueDate===snap.dueDate && st.remarks===snap.remarks;
          if(unchanged) st.dirty = false;
        });
        const stillDirty = Object.values(EDU_STATE).some(st=>st.dirty);
        if(stillDirty){
          saveDraftToLocal(); // 保存できていない分がまだあるので、下書きは残しておく
        } else {
          clearDraft();
        }
      }
    } else {
      showToast('⚠️ 保存に失敗しました。もう一度お試しください（' + (data.message||'') + '）', 6000);
    }
  }catch(e){
    showToast('⚠️ 保存に失敗しました。ネットワークを確認してもう一度お試しください', 6000);
    console.error(e);
  }finally{
    SAVING = false;
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

document.getElementById('saveBtn').addEventListener('click', saveEducation);
document.getElementById('targetInput').addEventListener('blur', loadEduDataForTarget);
document.getElementById('targetInput').addEventListener('input', saveDraftToLocal);
document.getElementById('lineInput').addEventListener('input', saveDraftToLocal);
document.getElementById('dateInput').addEventListener('change', saveDraftToLocal);
document.getElementById('trainerInput').addEventListener('input', saveDraftToLocal);

function populateAdminSelectors(){
  const groupList = document.getElementById('adminGroupList');
  // 教育設定に既に登録済みの工程名 + スキルチェック側の工程名（重複除去）を候補にする
  const groupNames = [...new Set([
    ...EDU_GROUPS.map(g=>g.name),
    ...SKC_GROUPS.map(g=>g.name),
  ])];
  groupList.innerHTML = groupNames.map(n=>`<option value="${escapeAttr(n)}"></option>`).join('');

  const delGroupSelect = document.getElementById('adminDelGroupSelect');
  const curGroup = delGroupSelect.value;
  delGroupSelect.innerHTML = EDU_GROUPS.map(g=>`<option value="${escapeAttr(g.name)}">${escapeHtml(g.name)}</option>`).join('');
  if(curGroup && [...delGroupSelect.options].some(o=>o.value===curGroup)) delGroupSelect.value = curGroup;

  populateAdminSkillSelectors();
  updateAddSkillSuggestions();
}

// 「項目を追加する」フォームの工程名入力に応じて、親スキル項目の候補を更新する
// （既に教育設定に登録済みの親スキル名 + スキルチェック側の同名工程のスキル項目名を候補にする）
function updateAddSkillSuggestions(){
  const gname = document.getElementById('adminGroupInput').value.trim();
  const addSkillList = document.getElementById('adminAddSkillList');
  if(!addSkillList) return;
  const eduGroup = EDU_GROUPS.find(g=>g.name===gname);
  const skcGroup = SKC_GROUPS.find(g=>g.name===gname);
  const names = [...new Set([
    ...(eduGroup ? eduGroup.skills.map(s=>s.name) : []),
    ...(skcGroup ? skcGroup.items : []),
  ])];
  addSkillList.innerHTML = names.map(n=>`<option value="${escapeAttr(n)}"></option>`).join('');
}

function populateAdminSkillSelectors(){
  const gname = document.getElementById('adminDelGroupSelect').value;
  const g = EDU_GROUPS.find(g0=>g0.name===gname);

  const delSkillSelect = document.getElementById('adminDelSkillSelect');
  const curSkill = delSkillSelect.value;
  delSkillSelect.innerHTML = (g ? g.skills : []).map(s=>`<option value="${escapeAttr(s.name)}">${escapeHtml(s.name)}</option>`).join('');
  if(curSkill && [...delSkillSelect.options].some(o=>o.value===curSkill)) delSkillSelect.value = curSkill;

  renderAdminItemList();
}

function renderAdminItemList(){
  const gname = document.getElementById('adminDelGroupSelect').value;
  const sname = document.getElementById('adminDelSkillSelect').value;
  const g = EDU_GROUPS.find(g0=>g0.name===gname);
  const s = g ? g.skills.find(s0=>s0.name===sname) : null;
  const area = document.getElementById('adminItemListArea');
  if(!s || !s.items.length){
    area.innerHTML = `<div class="empty-note">項目がありません</div>`;
    return;
  }
  area.innerHTML = s.items.map((it,i)=>`
    <div class="v-admin-item-row">
      <div>${escapeHtml(it)}</div>
      <div class="v-admin-reorder-btns">
        <button data-reorder="up" data-item="${escapeAttr(it)}" ${i===0?'disabled':''}>↑</button>
        <button data-reorder="down" data-item="${escapeAttr(it)}" ${i===s.items.length-1?'disabled':''}>↓</button>
        <button data-delitem="${escapeAttr(it)}" style="color:#C0392B;">✕</button>
      </div>
    </div>`).join('');

  area.querySelectorAll('[data-reorder]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      await callAdminAction('reorderEduItem', { group: gname, skill: sname, item: btn.dataset.item, direction: btn.dataset.reorder });
    });
  });
  area.querySelectorAll('[data-delitem]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(`「${btn.dataset.delitem}」を削除しますか？`)) return;
      await callAdminAction('deleteEduItem', { group: gname, skill: sname, item: btn.dataset.delitem });
    });
  });
}

async function callAdminAction(action, params){
  const msg = document.getElementById('adminDelMsg');
  if(!SHEET_WEBAPP_URL){ msg.textContent='サーバーURLが未設定です'; msg.className='v-admin-msg err'; return; }
  msg.textContent = '処理中...';
  msg.className = 'v-admin-msg';
  try{
    const res = await fetch(SHEET_WEBAPP_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action}, params)),
    });
    const text = await res.text();
    const data = JSON.parse(text);
    if(data.status === 'ok'){
      if(data.groups){ EDU_GROUPS = data.groups; rebuildStateFromGroups(true); }
      render();
      populateAdminSelectors();
      msg.textContent = '更新しました';
      msg.className = 'v-admin-msg ok';
    } else {
      msg.textContent = data.message || '失敗しました';
      msg.className = 'v-admin-msg err';
    }
  }catch(e){
    msg.textContent = '通信に失敗しました: ' + (e.message||e);
    msg.className = 'v-admin-msg err';
    console.error(e);
  }
}

document.getElementById('evalModeTrainerBtn').addEventListener('click', ()=>{
  if(evalMode === 'trainer') return;
  evalMode = 'trainer';
  document.getElementById('evalModeTrainerBtn').classList.add('active');
  document.getElementById('evalModeSelfBtn').classList.remove('active');
  document.getElementById('evalModeNote').textContent = '今は「教育担当者評価」を入力するページです。切り替えると、同じ工程・項目でも自己評価の入力ページに変わります。';
  render();
});
document.getElementById('evalModeSelfBtn').addEventListener('click', ()=>{
  if(evalMode === 'self') return;
  evalMode = 'self';
  document.getElementById('evalModeSelfBtn').classList.add('active');
  document.getElementById('evalModeTrainerBtn').classList.remove('active');
  document.getElementById('evalModeNote').textContent = '今は「本人の自己評価」を入力するページです。切り替えると、同じ工程・項目でも教育担当者評価の入力ページに変わります。';
  render();
});

document.getElementById('adminToggleBtn').addEventListener('click', ()=>{
  const panel = document.getElementById('adminPanel');
  if(panel.style.display !== 'none'){
    panel.style.display = 'none';
    return;
  }
  if(!adminUnlocked){
    const pw = prompt('管理者パスワードを入力してください');
    if(pw === null) return;
    if(pw !== ADMIN_PASSWORD){ alert('パスワードが違います'); return; }
    adminUnlocked = true;
  }
  populateAdminSelectors();
  panel.style.display = 'block';
});

document.getElementById('adminDelGroupSelect').addEventListener('change', populateAdminSkillSelectors);
document.getElementById('adminDelSkillSelect').addEventListener('change', renderAdminItemList);
document.getElementById('adminGroupInput').addEventListener('input', updateAddSkillSuggestions);

document.getElementById('adminAddBtn').addEventListener('click', async ()=>{
  const group = document.getElementById('adminGroupInput').value.trim();
  const skill = document.getElementById('adminSkillInput').value.trim();
  const item = document.getElementById('adminItemInput').value.trim();
  const msg = document.getElementById('adminMsg');
  if(!group || !skill || !item){ msg.textContent='工程・親スキル・詳細項目を全て入力してください'; msg.className='v-admin-msg err'; return; }
  if(!SHEET_WEBAPP_URL){ msg.textContent='サーバーURLが未設定です'; msg.className='v-admin-msg err'; return; }
  msg.textContent = '追加中...';
  msg.className = 'v-admin-msg';
  try{
    const res = await fetch(SHEET_WEBAPP_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'addEduItem', group, skill, item }),
    });
    const text = await res.text();
    const data = JSON.parse(text);
    if(data.status === 'ok'){
      if(data.groups){ EDU_GROUPS = data.groups; rebuildStateFromGroups(true); }
      render();
      populateAdminSelectors();
      document.getElementById('adminItemInput').value = '';
      msg.textContent = `「${group} / ${skill}」に「${item}」を追加しました`;
      msg.className = 'v-admin-msg ok';
    } else {
      msg.textContent = data.message || '追加に失敗しました';
      msg.className = 'v-admin-msg err';
    }
  }catch(e){
    msg.textContent = '通信に失敗しました: ' + (e.message||e);
    msg.className = 'v-admin-msg err';
    console.error(e);
  }
});
