<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>包装工程 教育チェックシート</title>
<style>
  :root{
    --navy:#1F3864;
    --navy-2:#2E4C82;
    --bg:#F3F4F7;
    --card:#FFFFFF;
    --amber:#D98E2B;
    --green:#2F8F5B;
    --text:#1C2430;
    --text-muted:#6B7280;
    --border:#E1E4EA;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  .num{font-family:"DejaVu Sans Mono","SF Mono",monospace;}

  header.top{
    position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;
    padding:14px 16px 12px;box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .v-icon-btn{position:absolute;top:14px;width:32px;height:32px;border-radius:9px;
    border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);
    color:#fff;font-size:15px;line-height:1;cursor:pointer;display:flex;
    align-items:center;justify-content:center;}
  .v-icon-btn:active{background:rgba(255,255,255,.25);}
  header.top h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:.02em;}
  header.top .sub{font-size:11px;opacity:.75;margin-top:2px;}
  .progress-wrap{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .ring{position:relative;width:38px;height:38px;flex:none;}
  .ring svg{transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:4;}
  .ring .bg{stroke:rgba(255,255,255,.25);}
  .ring .fg{stroke:var(--amber);stroke-linecap:round;transition:stroke-dashoffset .3s ease;}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;}
  .progress-text{font-size:12px;opacity:.9;}
  .progress-text b{font-size:14px;}

  .v-floating-panel{position:sticky;top:0;z-index:49;max-width:520px;margin:0 auto 10px;
    border-top:none;border-radius:0 0 var(--radius) var(--radius);
    box-shadow:0 6px 14px rgba(0,0,0,.12);}

  main{max-width:520px;margin:0 auto;padding:14px 12px 100px;}

  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    padding:14px;margin-bottom:12px;}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--navy);font-weight:700;}
  .field{margin-bottom:10px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:4px;}
  .field input, .field select{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;
    font-size:15px;background:#FAFBFC;color:var(--text);
    height:42px;box-sizing:border-box;-webkit-appearance:none;appearance:none;
  }
  .field input:focus{outline:2px solid var(--navy-2);outline-offset:1px;}

  .empty-note{font-size:12px;color:var(--text-muted);padding:20px 4px;text-align:center;}
  .setup-note{font-size:12px;color:var(--text-muted);line-height:1.6;}

  /* 工程アコーディオン */
  .group{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    margin-bottom:10px;overflow:hidden;}
  .group-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
    cursor:pointer;user-select:none;}
  .group-hd .name{font-size:14px;font-weight:700;}
  .group-hd .meta{display:flex;align-items:center;gap:8px;}
  .group-hd .count{font-size:11px;color:var(--text-muted);}
  .group-hd .count b{color:var(--navy);}
  .chev{width:9px;height:9px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);
    transform:rotate(45deg);transition:transform .2s ease;margin-right:2px;}
  .group.open > .group-hd .chev{transform:rotate(-135deg);}
  .group-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .group.open > .group-body{max-height:20000px;}

  /* 親スキル */
  .skill{border-top:1px solid var(--border);}
  .skill-hd{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;
    cursor:pointer;background:#FAFBFC;}
  .skill-hd .sname{font-size:13px;font-weight:700;}
  .skill-hd .sprog{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;}
  .skill-hd .sprog b{color:var(--navy);}
  .skill-hd .badge-complete{background:var(--green);color:#fff;font-size:10px;font-weight:700;
    padding:2px 7px;border-radius:6px;}
  .skill-bar-wrap{height:5px;background:var(--border);}
  .skill-bar{height:100%;background:var(--amber);transition:width .2s ease;}
  .skill.sk-complete .skill-bar{background:var(--green);}
  .skill-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .skill.open > .skill-body{max-height:20000px;}

  /* 詳細項目 */
  .item{padding:12px 14px;border-top:1px solid var(--border);}
  .item .iname{font-size:13px;font-weight:600;margin-bottom:8px;}
  .lv-row{display:flex;gap:5px;margin-bottom:6px;}
  .lv-btn{
    flex:1;padding:9px 0;border-radius:9px;border:1.5px solid var(--border);
    background:#FAFBFC;font-size:14px;font-weight:700;color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .lv-btn[data-lv="0"].active{background:#B0B4BA;border-color:#B0B4BA;color:#fff;}
  .lv-btn[data-lv="1"].active{background:#CBBE8A;border-color:#CBBE8A;color:#fff;}
  .lv-btn[data-lv="2"].active{background:#D9A94E;border-color:#D9A94E;color:#fff;}
  .lv-btn[data-lv="3"].active{background:#8FBF6B;border-color:#8FBF6B;color:#fff;}
  .lv-btn[data-lv="4"].active{background:#2F8F5B;border-color:#2F8F5B;color:#fff;}
  .lv-current{font-size:12px;font-weight:700;margin-bottom:8px;}
  .lv-current .lv-current-label{padding:2px 9px;border-radius:7px;color:#fff;}
  .item-remarks-toggle{background:none;border:none;color:var(--navy);font-size:11.5px;
    font-weight:700;padding:2px 0;cursor:pointer;}
  .item-remarks-input{width:100%;margin-top:6px;padding:8px 9px;border:1px solid var(--border);
    border-radius:8px;font-size:13px;background:#FAFBFC;color:var(--text);box-sizing:border-box;}

  /* 基本情報の氏名候補 */
  .v-search-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;
    font-size:15px;background:#FAFBFC;color:var(--text);box-sizing:border-box;height:42px;}

  .v-admin-card{margin-top:14px;}
  .v-admin-link{width:100%;background:none;border:none;padding:4px 0;font-size:12.5px;
    color:var(--text-muted);text-align:left;cursor:pointer;}
  .v-admin-section-title{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px;
    padding-top:10px;border-top:1px solid var(--border);}
  .v-admin-add-btn{width:100%;padding:10px 0;border:none;border-radius:10px;background:var(--navy);
    color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:4px;}
  .v-admin-add-btn:active{background:var(--navy-2);}
  .v-admin-del-btn{width:100%;padding:10px 0;border:1.5px solid #C0392B;border-radius:10px;
    background:#fff;color:#C0392B;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:4px;}
  .v-admin-del-btn:active{background:#FBEAE8;}
  .v-admin-msg{font-size:12px;margin-top:8px;min-height:16px;}
  .v-admin-msg.ok{color:var(--green);}
  .v-admin-msg.err{color:#C0392B;}
  .v-admin-item-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 0;border-top:1px solid var(--border);font-size:12.5px;}
  .v-admin-item-row:first-of-type{border-top:none;}
  .v-admin-reorder-btns{display:flex;gap:4px;flex:none;}
  .v-admin-reorder-btns button{width:26px;height:26px;border:1px solid var(--border);border-radius:6px;
    background:#FAFBFC;cursor:pointer;font-size:11px;}

  .save-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(180deg,rgba(243,244,247,0),var(--bg) 30%);
    padding:14px 12px 16px;display:flex;justify-content:center;}
  .save-btn{max-width:496px;width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(31,56,100,.35);cursor:pointer;}
  .save-btn:active{background:var(--navy-2);}
  .save-btn:disabled{opacity:.6;}
  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(8px);
    background:var(--text);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
    opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;z-index:60;
    max-width:88vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (min-width: 860px){
    main{max-width:900px;}
    .card{max-width:900px;margin-left:auto;margin-right:auto;}
    .group{max-width:900px;margin-left:auto;margin-right:auto;}
    .save-bar{display:flex;justify-content:center;}
    .save-btn{max-width:900px;}
  }
</style>
</head>
<body>

<header class="top">
  <button id="adminToggleBtn" class="v-icon-btn" style="right:14px;">🔧</button>
  <h1>包装工程 教育チェックシート</h1>
  <div class="sub" id="headerSub">対象者を選んで教育状況を記録します</div>
  <div class="progress-wrap">
    <div class="ring">
      <svg width="38" height="38" viewBox="0 0 38 38">
        <circle class="bg" cx="19" cy="19" r="16"></circle>
        <circle class="fg" id="ringFg" cx="19" cy="19" r="16" stroke-dasharray="100.5" stroke-dashoffset="100.5"></circle>
      </svg>
      <div class="pct num" id="ringPct">0%</div>
    </div>
    <div class="progress-text">完了 <b class="num" id="doneCount">0</b> / <span class="num" id="totalCount">0</span> 項目</div>
  </div>
</header>

<div id="adminPanel" class="card v-floating-panel" style="display:none;">
  <div class="v-admin-section-title" style="border-top:none;padding-top:0;">🔧 管理者: 教育項目を編集</div>

  <div class="v-admin-section-title">項目を追加する</div>
  <div class="field">
    <label for="adminGroupInput">工程名（既存の工程名を選ぶか、新しい名前を入力）</label>
    <input id="adminGroupInput" type="text" placeholder="例: STP工程" list="adminGroupList">
    <datalist id="adminGroupList"></datalist>
  </div>
  <div class="field">
    <label for="adminSkillInput">親スキル項目名（工程名を選ぶと候補が出ます）</label>
    <input id="adminSkillInput" type="text" placeholder="例: STP2" list="adminAddSkillList">
    <datalist id="adminAddSkillList"></datalist>
  </div>
  <div class="field">
    <label for="adminItemInput">詳細教育項目名</label>
    <input id="adminItemInput" type="text" placeholder="例: 主電源を入れる">
  </div>
  <button id="adminAddBtn" class="v-admin-add-btn">この項目を追加する</button>
  <div id="adminMsg" class="v-admin-msg"></div>

  <div class="v-admin-section-title">既存の項目を削除・並び替え</div>
  <div class="field">
    <label for="adminDelGroupSelect">工程</label>
    <select id="adminDelGroupSelect"></select>
  </div>
  <div class="field">
    <label for="adminDelSkillSelect">親スキル項目</label>
    <select id="adminDelSkillSelect"></select>
  </div>
  <div id="adminItemListArea"></div>
  <div id="adminDelMsg" class="v-admin-msg"></div>
</div>

<main>
  <div class="card">
    <h2>基本情報</h2>
    <div class="field">
      <label for="targetInput">対象者（教育を受ける人）</label>
      <input id="targetInput" type="text" placeholder="例: 吉井蓮" autocomplete="off" list="rosterList1">
      <datalist id="rosterList1"></datalist>
    </div>
    <div class="field">
      <label for="lineInput">所属ライン</label>
      <input id="lineInput" type="text" placeholder="例: 瓶包装" autocomplete="off">
    </div>
    <div class="field">
      <label for="dateInput">教育日</label>
      <input id="dateInput" type="date">
    </div>
    <div class="field">
      <label for="trainerInput">教育担当者</label>
      <input id="trainerInput" type="text" placeholder="例: 吉井蓮" autocomplete="off" list="rosterList2">
      <datalist id="rosterList2"></datalist>
    </div>
  </div>

  <div id="groupsArea"></div>
</main>

<div class="save-bar">
  <button class="save-btn" id="saveBtn">保存する</button>
</div>
<div class="toast" id="toast"></div>

<script>
// ↓ Apps ScriptのウェブアプリURL(index.html / viewer2.htmlと同じもの)
const DEFAULT_SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbz-TjWClvojimS6R_FVVpKEufzKo6kUFtNVw-YFXSQhSWL0nkhx3StKRxsrEty5k2wm/exec";
const WEBAPP_URL_KEY = 'skillcheck_webapp_url'; // index.html/viewer2.htmlと同じキーを共有
let SHEET_WEBAPP_URL = (function(){
  try{
    const saved = localStorage.getItem(WEBAPP_URL_KEY);
    return saved || DEFAULT_SHEET_WEBAPP_URL;
  }catch(e){ return DEFAULT_SHEET_WEBAPP_URL; }
})();

const LV_LABELS = ["未教育","説明済み","補助あり","一人で可能","指導可能"];
const LV_COLORS = ["#B0B4BA","#CBBE8A","#D9A94E","#8FBF6B","#2F8F5B"];
const ADMIN_PASSWORD = "1222";

let EDU_GROUPS = [];   // [{name, skills:[{name, items:[itemName,...]}]}]
let SKC_GROUPS = [];   // スキルチェック側の工程・スキル項目 [{name, items:[itemName,...]}]（管理者パネルの入力候補として使う）
let EDU_STATE = {};    // key "group|||skill|||item" -> {lv:null, remarks:"", dirty:false}
let ROSTER = [];
let openGroups = new Set();
let openSkills = new Set();
let adminUnlocked = false;

function stateKey(g,s,it){ return g+'|||'+s+'|||'+it; }

function rebuildStateFromGroups(preserve){
  const newState = {};
  EDU_GROUPS.forEach(g=>{
    g.skills.forEach(s=>{
      s.items.forEach(it=>{
        const key = stateKey(g.name, s.name, it);
        newState[key] = (preserve && EDU_STATE[key]) ? EDU_STATE[key] : { lv:null, remarks:"", dirty:false };
      });
    });
  });
  EDU_STATE = newState;
}

function showToast(msg, duration){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>t.classList.remove('show'), duration || 3200);
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(str){
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ---------------------------------------------------------------------------
// 描画
// ---------------------------------------------------------------------------
function render(){
  const area = document.getElementById('groupsArea');
  if(!EDU_GROUPS.length){
    area.innerHTML = `<div class="card"><div class="empty-note">教育項目がまだ登録されていません。右上の🔧から管理者パスワードを入力して、工程・親スキル・詳細項目を追加してください。</div></div>`;
    updateProgress();
    return;
  }

  area.innerHTML = EDU_GROUPS.map(g=>{
    const allItems = [];
    g.skills.forEach(s=>s.items.forEach(it=>allItems.push(stateKey(g.name,s.name,it))));
    const doneInGroup = allItems.filter(k=>EDU_STATE[k] && EDU_STATE[k].lv>=3).length;
    const isOpen = openGroups.has(g.name);

    const skillsHtml = g.skills.map(s=>{
      const keys = s.items.map(it=>stateKey(g.name,s.name,it));
      const done = keys.filter(k=>EDU_STATE[k] && EDU_STATE[k].lv>=3).length;
      const total = keys.length;
      const pct = total ? Math.round(done/total*100) : 0;
      const complete = total>0 && done===total;
      const skillOpen = openSkills.has(g.name+'|||'+s.name);

      const itemsHtml = s.items.map(it=>{
        const key = stateKey(g.name,s.name,it);
        const st = EDU_STATE[key] || {lv:null, remarks:"", dirty:false};
        const lvBtns = [0,1,2,3,4].map(n=>`<div class="lv-btn ${st.lv===n?'active':''} num" data-key="${escapeAttr(key)}" data-lv="${n}">${n}</div>`).join('');
        const curLabel = st.lv===null ? '未選択' : LV_LABELS[st.lv];
        const curColor = st.lv===null ? '#B0B4BA' : LV_COLORS[st.lv];
        const remarksVisible = st.remarks && st.remarks.length>0;
        return `
          <div class="item">
            <div class="iname">${escapeHtml(it)}</div>
            <div class="lv-row">${lvBtns}</div>
            <div class="lv-current"><span class="lv-current-label" style="background:${curColor};">${curLabel}</span></div>
            <button class="item-remarks-toggle" data-key="${escapeAttr(key)}">💬 備考${remarksVisible ? '（入力あり）' : ''}</button>
            <input type="text" class="item-remarks-input" data-key="${escapeAttr(key)}" placeholder="備考(任意)"
              value="${escapeAttr(st.remarks||'')}" style="display:${remarksVisible?'block':'none'};">
          </div>`;
      }).join('');

      return `
        <div class="skill ${complete?'sk-complete':''} ${skillOpen?'open':''}" data-gname="${escapeAttr(g.name)}" data-sname="${escapeAttr(s.name)}">
          <div class="skill-hd" data-skilltoggle="${escapeAttr(g.name)}|||${escapeAttr(s.name)}">
            <div class="sname">${escapeHtml(s.name)}</div>
            <div class="sprog">
              ${complete ? '<span class="badge-complete">認定可能</span>' : ''}
              <b class="num">${done}</b>/<span class="num">${total}</span>　<span class="num">${pct}%</span>
              <div class="chev"></div>
            </div>
          </div>
          <div class="skill-bar-wrap"><div class="skill-bar" style="width:${pct}%;"></div></div>
          <div class="skill-body">${itemsHtml}</div>
        </div>`;
    }).join('');

    return `
      <div class="group ${isOpen?'open':''}" data-gname="${escapeAttr(g.name)}">
        <div class="group-hd" data-grouptoggle="${escapeAttr(g.name)}">
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="meta">
            <div class="count"><b class="num">${doneInGroup}</b><span class="num">/${allItems.length}</span></div>
            <div class="chev"></div>
          </div>
        </div>
        <div class="group-body">${skillsHtml}</div>
      </div>`;
  }).join('');

  wireGroupEvents();
  updateProgress();
}

function wireGroupEvents(){
  const area = document.getElementById('groupsArea');
  area.querySelectorAll('[data-grouptoggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const gname = el.dataset.grouptoggle;
      if(openGroups.has(gname)) openGroups.delete(gname); else openGroups.add(gname);
      render();
    });
  });
  area.querySelectorAll('[data-skilltoggle]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = el.dataset.skilltoggle;
      if(openSkills.has(key)) openSkills.delete(key); else openSkills.add(key);
      render();
    });
  });
  area.querySelectorAll('.lv-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = btn.dataset.key, lv = parseInt(btn.dataset.lv,10);
      if(!EDU_STATE[key]) EDU_STATE[key] = {lv:null, remarks:"", dirty:false};
      EDU_STATE[key].lv = (EDU_STATE[key].lv === lv) ? null : lv;
      EDU_STATE[key].dirty = true;
      render();
      saveDraftToLocal();
    });
  });
  area.querySelectorAll('.item-remarks-toggle').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = btn.dataset.key;
      const input = area.querySelector(`.item-remarks-input[data-key="${CSS.escape(key)}"]`);
      if(input) input.style.display = input.style.display==='none' ? 'block' : 'none';
    });
  });
  area.querySelectorAll('.item-remarks-input').forEach(inp=>{
    inp.addEventListener('click', e=>e.stopPropagation());
    inp.addEventListener('input', ()=>{
      const key = inp.dataset.key;
      if(!EDU_STATE[key]) EDU_STATE[key] = {lv:null, remarks:"", dirty:false};
      EDU_STATE[key].remarks = inp.value;
      EDU_STATE[key].dirty = true;
      saveDraftToLocal();
    });
  });
}

function updateProgress(){
  const all = Object.values(EDU_STATE);
  const total = all.length;
  const done = all.filter(s=>s.lv!==null && s.lv>=3).length;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('doneCount').textContent = done;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('ringPct').textContent = pct+'%';
  const circ = 100.5;
  document.getElementById('ringFg').style.strokeDashoffset = circ - (circ*pct/100);
  const target = document.getElementById('targetInput').value.trim();
  document.getElementById('headerSub').textContent = target
    ? `${target} さんの教育状況を記録中`
    : '対象者を選んで教育状況を記録します';
}

// ---------------------------------------------------------------------------
// サーバー通信: 教育設定・名簿の読み込み
// ---------------------------------------------------------------------------
async function loadEduConfig(){
  if(!SHEET_WEBAPP_URL) return;
  try{
    const res = await fetch(SHEET_WEBAPP_URL + '?action=eduConfig', { method:'GET' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    EDU_GROUPS = data.groups || [];
    rebuildStateFromGroups(true);
    render();
  }catch(e){
    console.error('教育設定の読み込みエラー', e);
    showToast('⚠️ 教育項目の読み込みに失敗しました。電波の良い場所で開き直してください', 5000);
  }
}

// スキルチェック側の工程・スキル項目一覧を取得する（管理者パネルで「工程名」「親スキル項目名」を
// 一から手入力せず、既存の項目から選べるようにするため）
async function loadSkillCheckConfig(){
  if(!SHEET_WEBAPP_URL) return;
  try{
    const res = await fetch(SHEET_WEBAPP_URL + '?action=config', { method:'GET' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    SKC_GROUPS = data.groups || [];
    populateAdminSelectors();
  }catch(e){
    console.error('スキルチェック工程一覧の読み込みエラー', e);
  }
}

async function loadRoster(){
  if(!SHEET_WEBAPP_URL) return;
  try{
    const res = await fetch(SHEET_WEBAPP_URL + '?action=config', { method:'GET' });
    if(!res.ok) return;
    const data = await res.json();
    ROSTER = data.roster || [];
    const opts = ROSTER.map(n=>`<option value="${escapeAttr(n)}"></option>`).join('');
    document.getElementById('rosterList1').innerHTML = opts;
    document.getElementById('rosterList2').innerHTML = opts;
  }catch(e){
    console.error('名簿の読み込みエラー', e);
  }
}

// 対象者を選んだら、その人の過去の教育状態を読み込む
async function loadEduDataForTarget(){
  const name = document.getElementById('targetInput').value.trim();
  if(!name || !SHEET_WEBAPP_URL) return;
  try{
    const res = await fetch(SHEET_WEBAPP_URL + '?action=eduData&name=' + encodeURIComponent(name), { method:'GET' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(data.line) document.getElementById('lineInput').value = data.line;
    const current = data.current || {};
    Object.keys(current).forEach(key=>{
      const c = current[key];
      if(EDU_STATE[key] !== undefined){
        EDU_STATE[key] = { lv: (c.lv===null||c.lv===undefined||c.lv==="") ? null : Number(c.lv), remarks: c.remarks||"", dirty:false };
      }
    });
    render();
    saveDraftToLocal();
    if(Object.keys(current).length){
      showToast(name + ' さんの前回の教育状況を読み込みました');
    }
  }catch(e){
    console.error('教育データの読み込みエラー', e);
  }
}

// ---------------------------------------------------------------------------
// 下書き自動保存
// ---------------------------------------------------------------------------
const DRAFT_KEY = 'education_draft_v1';

function saveDraftToLocal(){
  try{
    const draft = {
      target: document.getElementById('targetInput').value,
      line: document.getElementById('lineInput').value,
      date: document.getElementById('dateInput').value,
      trainer: document.getElementById('trainerInput').value,
      state: EDU_STATE,
    };
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  }catch(e){}
}

function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
}

function tryRestoreDraft(){
  try{
    const raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    const draft = JSON.parse(raw);
    const hasEntry = draft.target || (draft.state && Object.values(draft.state).some(s=>s.lv!==null || s.remarks));
    if(!hasEntry){ clearDraft(); return; }
    if(!confirm(`前回、途中まで入力していた教育記録があります。復元しますか？\n（対象者: ${draft.target || '(未入力)'}）`)){
      clearDraft();
      return;
    }
    document.getElementById('targetInput').value = draft.target || '';
    document.getElementById('lineInput').value = draft.line || '';
    if(draft.date) document.getElementById('dateInput').value = draft.date;
    document.getElementById('trainerInput').value = draft.trainer || '';
    if(draft.state){
      Object.keys(EDU_STATE).forEach(k=>{
        if(draft.state[k]) EDU_STATE[k] = draft.state[k];
      });
    }
    render();
    showToast('下書きを復元しました');
  }catch(e){
    console.error('下書き復元エラー', e);
  }
}

// ---------------------------------------------------------------------------
// 保存
// ---------------------------------------------------------------------------
async function saveEducation(){
  const target = document.getElementById('targetInput').value.trim();
  if(!target){ showToast('対象者を入力してください'); return; }

  const changed = [];
  EDU_GROUPS.forEach(g=>{
    g.skills.forEach(s=>{
      s.items.forEach(it=>{
        const key = stateKey(g.name,s.name,it);
        const st = EDU_STATE[key];
        if(st && st.dirty){
          changed.push({ group:g.name, skill:s.name, item:it, lv:st.lv, remarks:st.remarks||"" });
        }
      });
    });
  });

  if(!changed.length){ showToast('変更された項目がありません'); return; }

  const payload = {
    action: 'saveEducation',
    target,
    line: document.getElementById('lineInput').value.trim(),
    date: document.getElementById('dateInput').value,
    trainer: document.getElementById('trainerInput').value.trim(),
    items: changed,
  };

  const btn = document.getElementById('saveBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = '保存中...';
  try{
    const res = await fetch(SHEET_WEBAPP_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    const data = JSON.parse(text);
    if(data.status === 'ok'){
      showToast(`保存しました（${changed.length}項目）`);
      Object.values(EDU_STATE).forEach(st=>{ st.dirty = false; });
      clearDraft();
    } else {
      showToast('⚠️ 保存に失敗しました。もう一度お試しください（' + (data.message||'') + '）', 6000);
    }
  }catch(e){
    showToast('⚠️ 保存に失敗しました。もう一度お試しください', 6000);
    console.error(e);
  }finally{
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

document.getElementById('saveBtn').addEventListener('click', saveEducation);
document.getElementById('targetInput').addEventListener('blur', loadEduDataForTarget);
document.getElementById('targetInput').addEventListener('input', saveDraftToLocal);
document.getElementById('lineInput').addEventListener('input', saveDraftToLocal);
document.getElementById('dateInput').addEventListener('change', saveDraftToLocal);
document.getElementById('trainerInput').addEventListener('input', saveDraftToLocal);

// ---------------------------------------------------------------------------
// 管理者パネル
// ---------------------------------------------------------------------------
function populateAdminSelectors(){
  const groupList = document.getElementById('adminGroupList');
  // 教育設定に既に登録済みの工程名 + スキルチェック側の工程名（重複除去）を候補にする
  const groupNames = [...new Set([
    ...EDU_GROUPS.map(g=>g.name),
    ...SKC_GROUPS.map(g=>g.name),
  ])];
  groupList.innerHTML = groupNames.map(n=>`<option value="${escapeAttr(n)}"></option>`).join('');

  const delGroupSelect = document.getElementById('adminDelGroupSelect');
  const curGroup = delGroupSelect.value;
  delGroupSelect.innerHTML = EDU_GROUPS.map(g=>`<option value="${escapeAttr(g.name)}">${g.name}</option>`).join('');
  if(curGroup && [...delGroupSelect.options].some(o=>o.value===curGroup)) delGroupSelect.value = curGroup;

  populateAdminSkillSelectors();
  updateAddSkillSuggestions();
}

// 「項目を追加する」フォームの工程名入力に応じて、親スキル項目の候補を更新する
// （既に教育設定に登録済みの親スキル名 + スキルチェック側の同名工程のスキル項目名を候補にする）
function updateAddSkillSuggestions(){
  const gname = document.getElementById('adminGroupInput').value.trim();
  const addSkillList = document.getElementById('adminAddSkillList');
  if(!addSkillList) return;
  const eduGroup = EDU_GROUPS.find(g=>g.name===gname);
  const skcGroup = SKC_GROUPS.find(g=>g.name===gname);
  const names = [...new Set([
    ...(eduGroup ? eduGroup.skills.map(s=>s.name) : []),
    ...(skcGroup ? skcGroup.items : []),
  ])];
  addSkillList.innerHTML = names.map(n=>`<option value="${escapeAttr(n)}"></option>`).join('');
}

function populateAdminSkillSelectors(){
  const gname = document.getElementById('adminDelGroupSelect').value;
  const g = EDU_GROUPS.find(g0=>g0.name===gname);

  const delSkillSelect = document.getElementById('adminDelSkillSelect');
  const curSkill = delSkillSelect.value;
  delSkillSelect.innerHTML = (g ? g.skills : []).map(s=>`<option value="${escapeAttr(s.name)}">${s.name}</option>`).join('');
  if(curSkill && [...delSkillSelect.options].some(o=>o.value===curSkill)) delSkillSelect.value = curSkill;

  renderAdminItemList();
}

function renderAdminItemList(){
  const gname = document.getElementById('adminDelGroupSelect').value;
  const sname = document.getElementById('adminDelSkillSelect').value;
  const g = EDU_GROUPS.find(g0=>g0.name===gname);
  const s = g ? g.skills.find(s0=>s0.name===sname) : null;
  const area = document.getElementById('adminItemListArea');
  if(!s || !s.items.length){
    area.innerHTML = `<div class="empty-note">項目がありません</div>`;
    return;
  }
  area.innerHTML = s.items.map((it,i)=>`
    <div class="v-admin-item-row">
      <div>${escapeHtml(it)}</div>
      <div class="v-admin-reorder-btns">
        <button data-reorder="up" data-item="${escapeAttr(it)}" ${i===0?'disabled':''}>↑</button>
        <button data-reorder="down" data-item="${escapeAttr(it)}" ${i===s.items.length-1?'disabled':''}>↓</button>
        <button data-delitem="${escapeAttr(it)}" style="color:#C0392B;">✕</button>
      </div>
    </div>`).join('');

  area.querySelectorAll('[data-reorder]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      await callAdminAction('reorderEduItem', { group: gname, skill: sname, item: btn.dataset.item, direction: btn.dataset.reorder });
    });
  });
  area.querySelectorAll('[data-delitem]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(`「${btn.dataset.delitem}」を削除しますか？`)) return;
      await callAdminAction('deleteEduItem', { group: gname, skill: sname, item: btn.dataset.delitem });
    });
  });
}

async function callAdminAction(action, params){
  const msg = document.getElementById('adminDelMsg');
  if(!SHEET_WEBAPP_URL){ msg.textContent='サーバーURLが未設定です'; msg.className='v-admin-msg err'; return; }
  msg.textContent = '処理中...';
  msg.className = 'v-admin-msg';
  try{
    const res = await fetch(SHEET_WEBAPP_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action}, params)),
    });
    const text = await res.text();
    const data = JSON.parse(text);
    if(data.status === 'ok'){
      if(data.groups){ EDU_GROUPS = data.groups; rebuildStateFromGroups(true); }
      render();
      populateAdminSelectors();
      msg.textContent = '更新しました';
      msg.className = 'v-admin-msg ok';
    } else {
      msg.textContent = data.message || '失敗しました';
      msg.className = 'v-admin-msg err';
    }
  }catch(e){
    msg.textContent = '通信に失敗しました: ' + (e.message||e);
    msg.className = 'v-admin-msg err';
    console.error(e);
  }
}

document.getElementById('adminToggleBtn').addEventListener('click', ()=>{
  const panel = document.getElementById('adminPanel');
  if(panel.style.display !== 'none'){
    panel.style.display = 'none';
    return;
  }
  if(!adminUnlocked){
    const pw = prompt('管理者パスワードを入力してください');
    if(pw === null) return;
    if(pw !== ADMIN_PASSWORD){ alert('パスワードが違います'); return; }
    adminUnlocked = true;
  }
  populateAdminSelectors();
  panel.style.display = 'block';
});

document.getElementById('adminDelGroupSelect').addEventListener('change', populateAdminSkillSelectors);
document.getElementById('adminDelSkillSelect').addEventListener('change', renderAdminItemList);
document.getElementById('adminGroupInput').addEventListener('input', updateAddSkillSuggestions);

document.getElementById('adminAddBtn').addEventListener('click', async ()=>{
  const group = document.getElementById('adminGroupInput').value.trim();
  const skill = document.getElementById('adminSkillInput').value.trim();
  const item = document.getElementById('adminItemInput').value.trim();
  const msg = document.getElementById('adminMsg');
  if(!group || !skill || !item){ msg.textContent='工程・親スキル・詳細項目を全て入力してください'; msg.className='v-admin-msg err'; return; }
  if(!SHEET_WEBAPP_URL){ msg.textContent='サーバーURLが未設定です'; msg.className='v-admin-msg err'; return; }
  msg.textContent = '追加中...';
  msg.className = 'v-admin-msg';
  try{
    const res = await fetch(SHEET_WEBAPP_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'addEduItem', group, skill, item }),
    });
    const text = await res.text();
    const data = JSON.parse(text);
    if(data.status === 'ok'){
      if(data.groups){ EDU_GROUPS = data.groups; rebuildStateFromGroups(true); }
      render();
      populateAdminSelectors();
      document.getElementById('adminItemInput').value = '';
      msg.textContent = `「${group} / ${skill}」に「${item}」を追加しました`;
      msg.className = 'v-admin-msg ok';
    } else {
      msg.textContent = data.message || '追加に失敗しました';
      msg.className = 'v-admin-msg err';
    }
  }catch(e){
    msg.textContent = '通信に失敗しました: ' + (e.message||e);
    msg.className = 'v-admin-msg err';
    console.error(e);
  }
});

// ---------------------------------------------------------------------------
// 初期化
// ---------------------------------------------------------------------------
(function init(){
  const today = new Date();
  document.getElementById('dateInput').value = today.toISOString().slice(0,10);
  loadEduConfig().then(()=>{ tryRestoreDraft(); });
  loadRoster();
  loadSkillCheckConfig();
})();
</script>
