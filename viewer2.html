<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>包装工程 スキルチェック閲覧</title>
<style>
  :root{
    --navy:#1F3864;
    --navy-2:#2E4C82;
    --bg:#F3F4F7;
    --card:#FFFFFF;
    --amber:#D98E2B;
    --green:#2F8F5B;
    --text:#1C2430;
    --text-muted:#6B7280;
    --border:#E1E4EA;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  .num{font-family:"DejaVu Sans Mono","SF Mono",monospace;}

  header.top{
    position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;
    padding:14px 16px 12px;box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em;}
  header.top .sub{font-size:11px;opacity:.75;margin-top:2px;}

  main{max-width:520px;margin:0 auto;padding:14px 12px 40px;}
  #detailPane{display:none;}
  #mainArea.detail-active #listPane{display:none;}
  #mainArea.detail-active #detailPane{display:block;}

  @media (min-width: 860px){
    main#mainArea{max-width:960px;display:flex;align-items:flex-start;gap:16px;}
    #mainArea #listPane{display:block !important;width:340px;flex:none;position:sticky;top:14px;}
    #mainArea #detailPane{display:block !important;flex:1;min-width:0;}
    #mainArea .backbar{display:none;}
    .v-table-wrap{overflow-x:auto;}
  }

  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    padding:14px;margin-bottom:12px;}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--navy);font-weight:700;}

  #lockScreen{
    position:fixed;inset:0;z-index:200;background:var(--navy);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  #lockScreen .box{background:#fff;border-radius:16px;padding:26px 22px;max-width:320px;width:100%;
    box-shadow:0 12px 30px rgba(0,0,0,.3);}
  #lockScreen h2{margin:0 0 6px;font-size:16px;color:var(--navy);}
  #lockScreen p{margin:0 0 16px;font-size:12.5px;color:var(--text-muted);}
  #lockScreen input{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;
    font-size:16px;text-align:center;letter-spacing:.05em;margin-bottom:10px;}
  #lockScreen button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--navy);
    color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;}
  #lockScreen .err{color:#C0392B;font-size:12px;margin-top:8px;display:none;}
  #appRoot{display:block;}

  .setup-note{font-size:12px;color:var(--text-muted);line-height:1.6;}
  .setup-note code{background:#EEF1F6;padding:1px 5px;border-radius:5px;font-size:11px;}

  .loading{text-align:center;padding:40px 0;color:var(--text-muted);font-size:13px;}

  .person-row{display:flex;align-items:center;justify-content:space-between;
    padding:12px 4px;border-top:1px solid var(--border);cursor:pointer;}
  .person-row:first-child{border-top:none;}
  .person-row .n{font-size:14.5px;font-weight:700;}
  .person-row .d{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .person-row .avg{font-size:18px;font-weight:700;color:var(--navy);}
  .person-row .chev{width:8px;height:8px;border-right:2px solid var(--text-muted);
    border-bottom:2px solid var(--text-muted);transform:rotate(-45deg);margin-left:10px;}

  .backbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;}
  .backbar .arrow{width:9px;height:9px;border-left:2px solid var(--navy);border-bottom:2px solid var(--navy);
    transform:rotate(45deg);}
  .backbar span{font-size:13px;color:var(--navy);font-weight:700;}

  .detail-hd{margin-bottom:10px;}
  .detail-hd .n{font-size:19px;font-weight:800;color:var(--navy);}
  .detail-hd .meta{font-size:12px;color:var(--text-muted);margin-top:3px;}

  .group-block{margin-bottom:10px;}
  .group-title{font-size:12.5px;font-weight:700;color:var(--navy);
    background:#EEF1F6;padding:7px 10px;border-radius:8px 8px 0 0;}
  .item-row{display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px;border-bottom:1px solid var(--border);background:var(--card);font-size:13px;}
  .item-row:last-child{border-radius:0 0 8px 8px;}
  .item-row .iname{flex:1;}
  .item-row .badges{display:flex;align-items:center;gap:6px;flex:none;}
  .lv-badge{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:#fff;}
  .sd-badge{font-size:10.5px;padding:2px 6px;border-radius:6px;font-weight:600;}
  .sd-yes{background:var(--green);color:#fff;}
  .sd-no{background:#EEF1F6;color:var(--text-muted);}
  .remarks-line{font-size:11.5px;color:var(--text-muted);padding:0 10px 8px;background:var(--card);
    margin-top:-1px;}
  .empty-note{font-size:12px;color:var(--text-muted);padding:20px 4px;text-align:center;}

  .v-table-wrap{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    overflow:hidden;margin-bottom:14px;}
  table.v-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
  table.v-table thead th{background:var(--navy);color:#fff;padding:8px 6px;font-size:10.5px;
    text-align:left;font-weight:700;}
  table.v-table thead th.v-c{text-align:center;}
  table.v-table col.v-col-no{width:9%;}
  table.v-table col.v-col-item{width:24%;}
  table.v-table col.v-col-lv{width:10%;}
  table.v-table col.v-col-sd{width:14%;}
  table.v-table col.v-col-bar{width:18%;}
  table.v-table col.v-col-remarks{width:25%;}
  table.v-table td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.v-table tr.v-group-row td{background:#EEF1F6;color:var(--navy);font-weight:700;font-size:11.5px;
    padding:6px 8px;}
  table.v-table td.v-c{text-align:center;}
  table.v-table td.v-lv{font-weight:800;}
  table.v-table td.v-bar{font-family:"DejaVu Sans Mono","SF Mono",monospace;letter-spacing:1px;
    color:var(--navy);font-size:12px;white-space:nowrap;}
  table.v-table td.v-remarks{color:var(--text-muted);font-size:11px;max-width:110px;
    white-space:normal;word-break:break-word;overflow-wrap:anywhere;line-height:1.5;}

  .v-radar-legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin-top:8px;
    padding-top:10px;border-top:1px solid var(--border);}
  .v-radar-legend-row{display:flex;justify-content:space-between;align-items:baseline;
    padding:3px 2px;font-size:11.5px;}
  .v-radar-legend-name{color:var(--text-muted);}
  .v-radar-legend-val{font-weight:700;color:var(--navy);}

  #lockScreen{
    position:fixed;inset:0;z-index:200;background:var(--navy);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  #lockScreen .box{background:#fff;border-radius:16px;padding:26px 22px;max-width:320px;width:100%;
    box-shadow:0 12px 30px rgba(0,0,0,.3);}
  #lockScreen h2{margin:0 0 6px;font-size:16px;color:var(--navy);}
  #lockScreen p{margin:0 0 16px;font-size:12.5px;color:var(--text-muted);}
  #lockScreen input{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;
    font-size:16px;text-align:center;letter-spacing:.05em;margin-bottom:10px;}
  #lockScreen button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--navy);
    color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;}
  #lockScreen .err{color:#C0392B;font-size:12px;margin-top:8px;display:none;}
  #appRoot{display:none;}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="box">
    <h2>🔒 パスワード</h2>
    <p>包装工程スキルチェックの提出データを閲覧します。</p>
    <input type="password" id="pwInput" placeholder="パスワード" inputmode="numeric" autocomplete="off">
    <button id="pwBtn">開く</button>
    <div class="err" id="pwErr">パスワードが違います</div>
  </div>
</div>

<div id="appRoot">
<header class="top">
  <h1>スキルチェック閲覧</h1>
  <div class="sub">スプレッドシートに保存された提出データを表示します</div>
</header>

<main id="mainArea">
  <div id="listPane"><div class="loading">読み込み中...</div></div>
  <div id="detailPane"><div class="card"><div class="empty-note">👈 左の一覧から人を選んでください</div></div></div>
</main>
</div>

<script>
// ここにApps ScriptのウェブアプリURLを貼ってください(保存アプリ側と同じURLでOK)
const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyWqNJuUujq0mLxNXz9gqnu2AOCuqOK5kSXaEBbLYBEOkI7n0QnbYtgoP-0aOg7_LTk/exec";

const GROUP_ORDER = [
  "2F新カートナー","旧カートナー","プラスチベース","新ライン","旧ライン",
  "手作業","選別工程","STP工程","給袋工程","ピロー","PTP工程",
];

function lvColor(lv){
  if(lv === null || lv === undefined || lv === "") return "#C9CDD4";
  const n = Number(lv);
  const stops = ["#B0B4BA","#C9C267","#E0C24C","#8FBF6B","#2F8F5B"];
  return stops[Math.max(0, Math.min(4, n))];
}

const APP_PASSWORD = "1222";
(function passwordGate(){
  const lock = document.getElementById('lockScreen');
  const root = document.getElementById('appRoot');
  const input = document.getElementById('pwInput');
  const btn = document.getElementById('pwBtn');
  const err = document.getElementById('pwErr');

  function unlock(){
    lock.style.display = 'none';
    root.style.display = 'block';
    loadData();
  }
  function tryUnlock(){
    if(input.value === APP_PASSWORD){ unlock(); }
    else{ err.style.display = 'block'; input.value=''; input.focus(); }
  }
  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
})();

let PEOPLE = [];

async function loadData(){
  const main = document.getElementById('listPane');
  if(!SHEET_WEBAPP_URL){
    main.innerHTML = `
      <div class="card">
        <h2>設定が必要です</h2>
        <div class="setup-note">
          このファイルの中の<br>
          <code>const SHEET_WEBAPP_URL = "";</code><br>
          に、保存アプリ(index.html)と同じApps ScriptのウェブアプリURLを貼り付けてください。
        </div>
      </div>`;
    return;
  }
  try{
    const res = await fetch(SHEET_WEBAPP_URL, { method: 'GET' });
    if(!res.ok){
      throw new Error('HTTPステータス: ' + res.status);
    }
    const text = await res.text();
    let data;
    try{
      data = JSON.parse(text);
    }catch(parseErr){
      throw new Error('JSONとして解釈できませんでした。応答内容: ' + text.slice(0, 300));
    }
    PEOPLE = data.people || [];
    renderList();
  }catch(e){
    main.innerHTML = `<div class="card"><h2>読み込みに失敗しました</h2>
      <div class="setup-note" style="margin-top:8px;word-break:break-all;">
        エラー詳細: ${escapeHtml(e.message || String(e))}
      </div></div>`;
    console.error(e);
    return;
  }
}

function latestBlock(rows){
  // 記録日時が入っている行を境目として、一番最後のブロックだけを取り出す
  let lastStart = 0;
  rows.forEach((r, i)=>{ if(r.ts) lastStart = i; });
  return rows.slice(lastStart);
}

function avgLv(rows){
  const vals = rows.filter(r=>r.lv !== null && r.lv !== "").map(r=>Number(r.lv));
  if(!vals.length) return null;
  return (vals.reduce((a,b)=>a+b,0) / vals.length).toFixed(2);
}

function renderList(){
  document.getElementById('mainArea').classList.remove('detail-active');
  const main = document.getElementById('listPane');
  if(!PEOPLE.length){
    main.innerHTML = `<div class="card"><div class="empty-note">まだ提出データがありません</div></div>`;
    return;
  }
  const rowsHtml = PEOPLE.map((p, idx)=>{
    const block = latestBlock(p.rows);
    const avg = avgLv(block);
    const date = block[0] && block[0].date ? block[0].date : '';
    const tenureText = block[0] ? calcTenureText(block[0].hire) : '';
    return `
      <div class="person-row" data-idx="${idx}">
        <div>
          <div class="n">${p.name}</div>
          <div class="d">${date || '日付未記入'}${tenureText ? '　'+tenureText : ''}</div>
        </div>
        <div style="display:flex;align-items:center;">
          <div class="avg num">${avg === null ? '-' : avg}</div>
          <div class="chev"></div>
        </div>
      </div>`;
  }).join('');
  main.innerHTML = `<div class="card"><h2>提出済み一覧（${PEOPLE.length}人）</h2>${rowsHtml}</div>`;
  main.querySelectorAll('.person-row').forEach(el=>{
    el.addEventListener('click', ()=> renderDetail(Number(el.dataset.idx)));
  });
}

function vBar(lv){
  if(lv === null || lv === "" || lv === undefined) return '';
  const n = Math.max(0, Math.min(4, Number(lv)));
  return '■'.repeat(n) + '□'.repeat(4-n);
}

function buildRadarSvg(groups, byGroup){
  const cx = 170, cy = 158, R = 100;
  const n = groups.length;
  const angleFor = i => (-90 + i * (360/n)) * Math.PI/180;
  const pt = (i, r) => [cx + r*Math.cos(angleFor(i)), cy + r*Math.sin(angleFor(i))];

  // グリッド(Lv 1〜4の同心多角形) + 目盛り数値(上方向の軸に表示)
  let gridPolys = '';
  let scaleLabels = '';
  for(let lv=1; lv<=4; lv++){
    const r = R * (lv/4);
    const pts = groups.map((g,i)=> pt(i, r).join(',')).join(' ');
    gridPolys += `<polygon points="${pts}" fill="none" stroke="#D9DCE3" stroke-width="1"/>`;
    scaleLabels += `<text x="${cx+4}" y="${cy - r}" font-size="8" fill="#9AA1AC">${lv.toFixed(1)}</text>`;
  }
  // 軸線
  let axisLines = '';
  groups.forEach((g,i)=>{
    const [x,y] = pt(i, R);
    axisLines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E1E4EA" stroke-width="1"/>`;
  });
  // データ多角形
  const avgList = groups.map(g=>{
    const vals = (byGroup[g]||[]).filter(r=>r.lv!==null && r.lv!=="").map(r=>Number(r.lv));
    return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
  });
  const dataPts = groups.map((g,i)=> pt(i, R*(avgList[i]/4)));
  const dataPolyStr = dataPts.map(p=>p.join(',')).join(' ');
  let dots = '';
  groups.forEach((g,i)=>{
    const [x,y] = dataPts[i];
    dots += `<circle cx="${x}" cy="${y}" r="2.6" fill="#1F3864"/>`;
  });
  // ラベル(工程名のみ、数値はチャート下の一覧に分離)
  let labels = '';
  groups.forEach((g,i)=>{
    const [x,y] = pt(i, R + 24);
    const angleDeg = (-90 + i * (360/n));
    let anchor = 'middle';
    if(angleDeg < -100 || angleDeg > 100) anchor = 'end';
    else if(angleDeg > -80 && angleDeg < 80 && Math.abs(angleDeg) > 15) anchor = 'start';
    labels += `<text x="${x}" y="${y}" font-size="9" fill="#1C2430" text-anchor="${anchor}" dominant-baseline="middle">${escapeHtml(g)}</text>`;
  });

  const svg = `
    <svg viewBox="0 0 340 336" width="100%" style="max-width:340px;display:block;margin:0 auto;">
      ${gridPolys}
      ${axisLines}
      <polygon points="${dataPolyStr}" fill="#3C7AC7" fill-opacity="0.35" stroke="#1F3864" stroke-width="2"/>
      ${dots}
      ${labels}
      ${scaleLabels}
    </svg>`;

  const legendRows = groups.map((g,i)=>`
    <div class="v-radar-legend-row">
      <span class="v-radar-legend-name">${escapeHtml(g)}</span>
      <span class="v-radar-legend-val num">${avgList[i].toFixed(2)}</span>
    </div>`).join('');
  const legend = `<div class="v-radar-legend">${legendRows}</div>`;

  return svg + legend;
}

function calcTenureText(hireDateStr){
  if(!hireDateStr) return '';
  const hire = new Date(hireDateStr + 'T00:00:00');
  if(isNaN(hire.getTime())) return '';
  const today = new Date();
  const years = Math.floor(((today - hire) / (1000*60*60*24*365)) * 10) / 10;
  if(years < 0) return '';
  return '社歴' + years.toFixed(1) + '年';
}

function renderDetail(idx){
  document.getElementById('mainArea').classList.add('detail-active');
  const main = document.getElementById('detailPane');
  const p = PEOPLE[idx];
  const block = latestBlock(p.rows);
  const line = block[0] ? block[0].line : '';
  const date = block[0] ? block[0].date : '';
  const hire = block[0] ? block[0].hire : '';
  const tenureText = calcTenureText(hire);
  const avg = avgLv(block);
  const shidoCount = block.filter(r=>r.sd === '有').length;

  const byGroup = {};
  block.forEach(r=>{
    if(!byGroup[r.group]) byGroup[r.group] = [];
    byGroup[r.group].push(r);
  });
  const groups = GROUP_ORDER.filter(g=>byGroup[g]).concat(Object.keys(byGroup).filter(g=>!GROUP_ORDER.includes(g)));

  let no = 0;
  const rowsHtml = groups.map(g=>{
    const groupRow = `<tr class="v-group-row"><td colspan="6">${escapeHtml(g)}</td></tr>`;
    const itemRows = byGroup[g].map(r=>{
      no++;
      const lv = r.lv === null || r.lv === "" ? "-" : r.lv;
      const sdClass = r.sd === "有" ? "sd-yes" : "sd-no";
      return `
        <tr>
          <td class="v-c">${no}</td>
          <td>${escapeHtml(r.item)}</td>
          <td class="v-c v-lv" style="color:${lvColor(r.lv)}">${lv}</td>
          <td class="v-c"><span class="sd-badge ${sdClass}">${r.sd || '無'}</span></td>
          <td class="v-bar">${vBar(r.lv)}</td>
          <td class="v-remarks">${r.remarks ? escapeHtml(r.remarks) : ''}</td>
        </tr>`;
    }).join('');
    return groupRow + itemRows;
  }).join('');

  main.innerHTML = `
    <div class="backbar" id="backBtn"><div class="arrow"></div><span>一覧に戻る</span></div>
    <div class="card">
      <div class="detail-hd">
        <div class="n">${escapeHtml(p.name)}</div>
        <div class="meta">${escapeHtml(line) || '所属未記入'}　${date || ''}${tenureText ? '　'+tenureText : ''}</div>
        <div class="meta" style="margin-top:4px;">総合平均レベル: <b class="num">${avg === null ? '-' : avg}</b>　　指導経験のある項目数: <b class="num">${shidoCount} / ${block.length}</b> 項目</div>
      </div>
    </div>
    <div class="card">
      <h2>工程別スキルレーダー（平均Lv）</h2>
      ${buildRadarSvg(groups, byGroup)}
    </div>
    <div class="v-table-wrap">
      <table class="v-table">
        <colgroup>
          <col class="v-col-no"><col class="v-col-item"><col class="v-col-lv">
          <col class="v-col-sd"><col class="v-col-bar"><col class="v-col-remarks">
        </colgroup>
        <thead>
          <tr>
            <th class="v-c">No.</th>
            <th>スキル項目</th>
            <th class="v-c">Lv</th>
            <th class="v-c">指導</th>
            <th>達成度</th>
            <th>備考</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', renderList);
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
